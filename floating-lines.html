<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Lines</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; min-height: 100vh; }

  #floating-lines-container {
    position: fixed;
    inset: 0;
    z-index: 0;
    mix-blend-mode: screen; /* 취향껏: screen / normal / overlay */
  }

  #floating-lines-container canvas {
    width: 100% !important;
    height: 100% !important;
  }

  .content {
    position: relative;
    z-index: 1;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: sans-serif;
    font-size: 2rem;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="floating-lines-container"></div>
<div class="content">여기에 콘텐츠</div>

<script type="module">
import {
  Clock, Mesh, OrthographicCamera, PlaneGeometry,
  Scene, ShaderMaterial, Vector2, Vector3, WebGLRenderer
} from 'three';

// ===== CONFIG (여기서 커스텀) =====
const CONFIG = {
  linesGradient: ['#ff00ff', '#4B0082', '#00ffff'],  // 그라디언트 색상 (null 이면 기본)
  enabledWaves: ['top', 'middle', 'bottom'],
  lineCount: [6, 6, 6],        // [top, middle, bottom]
  lineDistance: [5, 5, 5],     // [top, middle, bottom]
  topWavePosition:    { x: 10.0, y:  0.5, rotate: -0.4 },
  middleWavePosition: { x:  5.0, y:  0.0, rotate:  0.2 },
  bottomWavePosition: { x:  2.0, y: -0.7, rotate: -1.0 },
  animationSpeed: 1,
  interactive: true,
  bendRadius: 5.0,
  bendStrength: -0.5,
  mouseDamping: 0.05,
  parallax: true,
  parallaxStrength: 0.2,
};
// ==================================

const MAX_GRADIENT_STOPS = 8;

function hexToVec3(hex) {
  let v = hex.trim().replace('#','');
  let r=255, g=255, b=255;
  if (v.length===3) {
    r=parseInt(v[0]+v[0],16); g=parseInt(v[1]+v[1],16); b=parseInt(v[2]+v[2],16);
  } else if (v.length===6) {
    r=parseInt(v.slice(0,2),16); g=parseInt(v.slice(2,4),16); b=parseInt(v.slice(4,6),16);
  }
  return new Vector3(r/255, g/255, b/255);
}

const getLineCount = (waveType) => {
  if (!CONFIG.enabledWaves.includes(waveType)) return 0;
  const i = CONFIG.enabledWaves.indexOf(waveType);
  return Array.isArray(CONFIG.lineCount) ? (CONFIG.lineCount[i] ?? 6) : CONFIG.lineCount;
};

const getLineDistance = (waveType) => {
  if (!CONFIG.enabledWaves.includes(waveType)) return 0.01;
  const i = CONFIG.enabledWaves.indexOf(waveType);
  const d = Array.isArray(CONFIG.lineDistance) ? (CONFIG.lineDistance[i] ?? 5) : CONFIG.lineDistance;
  return d * 0.01;
};

const vertexShader = `
precision highp float;
void main() {
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`;

const fragmentShader = `
precision highp float;

uniform float iTime;
uniform vec3  iResolution;
uniform float animationSpeed;

uniform bool enableTop;
uniform bool enableMiddle;
uniform bool enableBottom;

uniform int topLineCount;
uniform int middleLineCount;
uniform int bottomLineCount;

uniform float topLineDistance;
uniform float middleLineDistance;
uniform float bottomLineDistance;

uniform vec3 topWavePosition;
uniform vec3 middleWavePosition;
uniform vec3 bottomWavePosition;

uniform vec2 iMouse;
uniform bool interactive;
uniform float bendRadius;
uniform float bendStrength;
uniform float bendInfluence;

uniform bool parallax;
uniform float parallaxStrength;
uniform vec2 parallaxOffset;

uniform vec3 lineGradient[8];
uniform int lineGradientCount;

const vec3 BLACK = vec3(0.0);
const vec3 PINK  = vec3(233.0, 71.0, 245.0) / 255.0;
const vec3 BLUE  = vec3(47.0,  75.0, 162.0) / 255.0;

mat2 rotate(float r) {
  return mat2(cos(r), sin(r), -sin(r), cos(r));
}

vec3 background_color(vec2 uv) {
  vec3 col = vec3(0.0);
  float y = sin(uv.x - 0.2) * 0.3 - 0.1;
  float m = uv.y - y;
  col += mix(BLUE, BLACK, smoothstep(0.0, 1.0, abs(m)));
  col += mix(PINK, BLACK, smoothstep(0.0, 1.0, abs(m - 0.8)));
  return col * 0.5;
}

vec3 getLineColor(float t, vec3 baseColor) {
  if (lineGradientCount <= 0) return baseColor;
  vec3 gradientColor;
  if (lineGradientCount == 1) {
    gradientColor = lineGradient[0];
  } else {
    float clampedT = clamp(t, 0.0, 0.9999);
    float scaled = clampedT * float(lineGradientCount - 1);
    int idx = int(floor(scaled));
    float f = fract(scaled);
    int idx2 = min(idx + 1, lineGradientCount - 1);
    vec3 c1 = lineGradient[idx];
    vec3 c2 = lineGradient[idx2];
    gradientColor = mix(c1, c2, f);
  }
  return gradientColor * 0.5;
}

float wave(vec2 uv, float offset, vec2 screenUv, vec2 mouseUv, bool shouldBend) {
  float time = iTime * animationSpeed;
  float x_offset   = offset;
  float x_movement = time * 0.1;
  float amp        = sin(offset + time * 0.2) * 0.3;
  float y          = sin(uv.x + x_offset + x_movement) * amp;

  if (shouldBend) {
    vec2 d = screenUv - mouseUv;
    float influence = exp(-dot(d, d) * bendRadius);
    float bendOffset = (mouseUv.y - screenUv.y) * influence * bendStrength * bendInfluence;
    y += bendOffset;
  }

  float m = uv.y - y;
  return 0.0175 / max(abs(m) + 0.01, 1e-3) + 0.01;
}

void mainImage(out vec4 fragColor, in vec2 fragCoord) {
  vec2 baseUv = (2.0 * fragCoord - iResolution.xy) / iResolution.y;
  baseUv.y *= -1.0;

  if (parallax) baseUv += parallaxOffset;

  vec3 col = vec3(0.0);
  vec3 b = lineGradientCount > 0 ? vec3(0.0) : background_color(baseUv);

  vec2 mouseUv = vec2(0.0);
  if (interactive) {
    mouseUv = (2.0 * iMouse - iResolution.xy) / iResolution.y;
    mouseUv.y *= -1.0;
  }

  if (enableBottom) {
    for (int i = 0; i < bottomLineCount; ++i) {
      float fi = float(i);
      float t = fi / max(float(bottomLineCount - 1), 1.0);
      vec3 lineCol = getLineColor(t, b);
      float angle = bottomWavePosition.z * log(length(baseUv) + 1.0);
      vec2 ruv = baseUv * rotate(angle);
      col += lineCol * wave(
        ruv + vec2(bottomLineDistance * fi + bottomWavePosition.x, bottomWavePosition.y),
        1.5 + 0.2 * fi, baseUv, mouseUv, interactive
      ) * 0.2;
    }
  }

  if (enableMiddle) {
    for (int i = 0; i < middleLineCount; ++i) {
      float fi = float(i);
      float t = fi / max(float(middleLineCount - 1), 1.0);
      vec3 lineCol = getLineColor(t, b);
      float angle = middleWavePosition.z * log(length(baseUv) + 1.0);
      vec2 ruv = baseUv * rotate(angle);
      col += lineCol * wave(
        ruv + vec2(middleLineDistance * fi + middleWavePosition.x, middleWavePosition.y),
        2.0 + 0.15 * fi, baseUv, mouseUv, interactive
      );
    }
  }

  if (enableTop) {
    for (int i = 0; i < topLineCount; ++i) {
      float fi = float(i);
      float t = fi / max(float(topLineCount - 1), 1.0);
      vec3 lineCol = getLineColor(t, b);
      float angle = topWavePosition.z * log(length(baseUv) + 1.0);
      vec2 ruv = baseUv * rotate(angle);
      ruv.x *= -1.0;
      col += lineCol * wave(
        ruv + vec2(topLineDistance * fi + topWavePosition.x, topWavePosition.y),
        1.0 + 0.2 * fi, baseUv, mouseUv, interactive
      ) * 0.1;
    }
  }

  fragColor = vec4(col, 1.0);
}

void main() {
  vec4 color = vec4(0.0);
  mainImage(color, gl_FragCoord.xy);
  gl_FragColor = color;
}
`;

// ===== INIT =====
const container = document.getElementById('floating-lines-container');

const scene    = new Scene();
const camera   = new OrthographicCamera(-1, 1, 1, -1, 0, 1);
camera.position.z = 1;

const renderer = new WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.domElement.style.width  = '100%';
renderer.domElement.style.height = '100%';
container.appendChild(renderer.domElement);

const uniforms = {
  iTime:           { value: 0 },
  iResolution:     { value: new Vector3(1, 1, 1) },
  animationSpeed:  { value: CONFIG.animationSpeed },
  enableTop:       { value: CONFIG.enabledWaves.includes('top') },
  enableMiddle:    { value: CONFIG.enabledWaves.includes('middle') },
  enableBottom:    { value: CONFIG.enabledWaves.includes('bottom') },
  topLineCount:    { value: getLineCount('top') },
  middleLineCount: { value: getLineCount('middle') },
  bottomLineCount: { value: getLineCount('bottom') },
  topLineDistance:    { value: getLineDistance('top') },
  middleLineDistance: { value: getLineDistance('middle') },
  bottomLineDistance: { value: getLineDistance('bottom') },
  topWavePosition:    { value: new Vector3(CONFIG.topWavePosition.x,    CONFIG.topWavePosition.y,    CONFIG.topWavePosition.rotate) },
  middleWavePosition: { value: new Vector3(CONFIG.middleWavePosition.x, CONFIG.middleWavePosition.y, CONFIG.middleWavePosition.rotate) },
  bottomWavePosition: { value: new Vector3(CONFIG.bottomWavePosition.x, CONFIG.bottomWavePosition.y, CONFIG.bottomWavePosition.rotate) },
  iMouse:          { value: new Vector2(-1000, -1000) },
  interactive:     { value: CONFIG.interactive },
  bendRadius:      { value: CONFIG.bendRadius },
  bendStrength:    { value: CONFIG.bendStrength },
  bendInfluence:   { value: 0 },
  parallax:        { value: CONFIG.parallax },
  parallaxStrength:{ value: CONFIG.parallaxStrength },
  parallaxOffset:  { value: new Vector2(0, 0) },
  lineGradient:    { value: Array.from({ length: MAX_GRADIENT_STOPS }, () => new Vector3(1,1,1)) },
  lineGradientCount: { value: 0 },
};

if (CONFIG.linesGradient && CONFIG.linesGradient.length > 0) {
  const stops = CONFIG.linesGradient.slice(0, MAX_GRADIENT_STOPS);
  uniforms.lineGradientCount.value = stops.length;
  stops.forEach((hex, i) => {
    const c = hexToVec3(hex);
    uniforms.lineGradient.value[i].set(c.x, c.y, c.z);
  });
}

const material = new ShaderMaterial({ uniforms, vertexShader, fragmentShader });
const geometry = new PlaneGeometry(2, 2);
scene.add(new Mesh(geometry, material));

const clock = new Clock();

// mouse / parallax state
const targetMouse    = new Vector2(-1000, -1000);
const currentMouse   = new Vector2(-1000, -1000);
const targetParallax = new Vector2(0, 0);
const currentParallax= new Vector2(0, 0);
let targetInfluence  = 0;
let currentInfluence = 0;

function setSize() {
  const w = container.clientWidth  || 1;
  const h = container.clientHeight || 1;
  renderer.setSize(w, h, false);
  uniforms.iResolution.value.set(renderer.domElement.width, renderer.domElement.height, 1);
}
setSize();

const ro = typeof ResizeObserver !== 'undefined'
  ? new ResizeObserver(setSize)
  : null;
if (ro) ro.observe(container);

if (CONFIG.interactive) {
  renderer.domElement.addEventListener('pointermove', e => {
    const rect = renderer.domElement.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const dpr = renderer.getPixelRatio();
    targetMouse.set(x * dpr, (rect.height - y) * dpr);
    targetInfluence = 1.0;
    if (CONFIG.parallax) {
      targetParallax.set(
        ((x - rect.width/2)  / rect.width)  *  CONFIG.parallaxStrength,
        -((y - rect.height/2) / rect.height) *  CONFIG.parallaxStrength
      );
    }
  });
  renderer.domElement.addEventListener('pointerleave', () => { targetInfluence = 0.0; });
}

function renderLoop() {
  uniforms.iTime.value = clock.getElapsedTime();

  if (CONFIG.interactive) {
    currentMouse.lerp(targetMouse, CONFIG.mouseDamping);
    uniforms.iMouse.value.copy(currentMouse);
    currentInfluence += (targetInfluence - currentInfluence) * CONFIG.mouseDamping;
    uniforms.bendInfluence.value = currentInfluence;
  }

  if (CONFIG.parallax) {
    currentParallax.lerp(targetParallax, CONFIG.mouseDamping);
    uniforms.parallaxOffset.value.copy(currentParallax);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(renderLoop);
}
renderLoop();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V-Live Caption | AI 자막 & 해석 서비스</title>
    <style>
        :root {
            --primary: #4CAF50;
            --ai-accent: #8E44AD;
            --danger: #f44336;
            --bg-color: #121212;
            --surface: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --nav-bg: #252525;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background-color: var(--surface);
            border-bottom: 1px solid #333;
        }

        nav {
            display: flex;
            background-color: var(--nav-bg);
            padding: 0 5%;
            gap: 10px;
            overflow-x: auto;
        }

        .nav-item {
            padding: 1.2rem 1rem;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-muted);
            border-bottom: 4px solid transparent;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .nav-item.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: rgba(255,255,255,0.03);
        }

        .container {
            flex: 1;
            display: none;
            flex-direction: column;
            padding: 1.5rem 1rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            gap: 1.5rem;
        }

        .container.active { display: flex; }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            flex: 1;
        }

        @media (max-width: 900px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-header {
            padding: 1rem 1.2rem;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid #333;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scroll-area {
            flex: 1;
            padding: 1.2rem;
            overflow-y: auto;
            height: 40vh;
            line-height: 1.8;
            font-size: 1.1rem;
        }

        .final-text { color: var(--text-main); }
        .interim-text { color: var(--text-muted); font-style: italic; }
        .ai-result { color: #d1b3ff; white-space: pre-wrap; }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            padding: 1rem 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:active { transform: scale(0.95); }
        .btn-start { background: var(--primary); color: white; }
        .btn-stop { background: var(--danger); color: white; }
        .btn-ai { background: var(--ai-accent); color: white; }

        .info-banner {
            background: rgba(52, 152, 219, 0.1);
            border-left: 4px solid #3498db;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* 소리 감지 게이지 스타일 */
        .audio-meter {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
            display: flex;
        }

        .audio-meter-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.1s;
        }

        footer { padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.8rem; }

        #pip-canvas { display: none; }
        #pip-video { display: none; }
    </style>
</head>
<body>

    <header>
        <h1 style="font-size: 1.4rem; margin:0;">🚀 V-Live Caption</h1>
        <button class="btn" style="background:#333; border:1px solid #555; font-size:0.8rem;">내 계정</button>
    </header>

    <nav>
        <div class="nav-item active" onclick="switchMode('mic')">1. 🎙️ 내 목소리 받아쓰기</div>
        <div class="nav-item" onclick="switchMode('youtube')">2. 📺 영상 소리 실시간 자막</div>
    </nav>

    <!-- 제품 1: 내 목소리 모드 -->
    <div id="mic-container" class="container active">
        <div class="info-banner" id="mic-info">
            💡 <strong>사용 팁:</strong> 마이크를 켜고 말씀하세요.
        </div>
        <div class="audio-meter"><div id="mic-meter" class="audio-meter-fill"></div></div>
        
        <div class="content-grid">
            <div class="card">
                <div class="card-header">📝 실시간 기록 (내 목소리)</div>
                <div id="mic-scroll" class="scroll-area">
                    <span id="mic-final" class="final-text"></span>
                    <span id="mic-interim" class="interim-text"></span>
                </div>
            </div>
            <div class="card" style="border-color: var(--ai-accent);">
                <div class="card-header" style="color: #d1b3ff;">🧠 AI 의도 해석 비서</div>
                <div class="scroll-area"><div id="mic-ai" class="ai-result">내용이 쌓이면 해석 버튼을 누르세요.</div></div>
            </div>
        </div>

        <div class="controls">
            <button onclick="startRec('mic')" id="mic-start" class="btn btn-start">🎙️ 기록 시작</button>
            <button onclick="stopRec('mic')" id="mic-stop" class="btn btn-stop" disabled>■ 중지</button>
            <button onclick="callAI('mic')" class="btn btn-ai">✨ AI 의도 해석하기</button>
        </div>
    </div>

    <!-- 제품 2: 영상 자막 모드 -->
    <div id="youtube-container" class="container">
        <div class="info-banner" id="youtube-info">
            🎧 <strong>에어팟 필수 셋팅:</strong> [스테레오 믹스 속성] -> [수신 대기] -> <strong>[이 장치로 듣기] 체크</strong> -> 재생 장치를 <strong>[에어팟]</strong>으로 설정하세요!
        </div>
        <div class="audio-meter"><div id="youtube-meter" class="audio-meter-fill"></div></div>

        <div class="content-grid">
            <div class="card">
                <div class="card-header">
                    📺 실시간 영상 자막
                    <button onclick="togglePip()" class="btn" style="background:#3498db; padding:0.4rem 0.8rem; font-size:0.7rem;">🗗 항상 위(PIP)</button>
                </div>
                <div id="youtube-scroll" class="scroll-area" style="background: #000; border: 4px solid #222;">
                    <span id="youtube-final" class="final-text" style="color: #ffffff;"></span>
                    <span id="youtube-interim" class="interim-text" style="color: #ffff00; font-weight: bold;"></span>
                </div>
            </div>
            <div class="card" style="border-color: var(--ai-accent);">
                <div class="card-header" style="color: #d1b3ff;">🧠 실시간 내용 요약</div>
                <div class="scroll-area"><div id="youtube-ai" class="ai-result">영상이 시작되면 AI가 핵심을 요약합니다.</div></div>
            </div>
        </div>

        <div class="controls">
            <button onclick="startRec('youtube')" id="youtube-start" class="btn btn-start" style="background:#e74c3c;">📺 자막 시작</button>
            <button onclick="stopRec('youtube')" id="youtube-stop" class="btn btn-stop" disabled>■ 중지</button>
            <button onclick="callAI('youtube')" class="btn btn-ai">✨ 영상 핵심 요약</button>
        </div>
    </div>

    <canvas id="pip-canvas" width="600" height="200"></canvas>
    <video id="pip-video" autoplay muted playsinline></video>

    <script>
        let recognition = null;
        let audioContext = null;
        let analyser = null;
        let animationId = null;

        const ui = {
            mic: { final: 'mic-final', interim: 'mic-interim', info: 'mic-info', meter: 'mic-meter', ai: 'mic-ai', scroll: 'mic-scroll', start: 'mic-start', stop: 'mic-stop' },
            youtube: { final: 'youtube-final', interim: 'youtube-interim', info: 'youtube-info', meter: 'youtube-meter', ai: 'youtube-ai', scroll: 'youtube-scroll', start: 'youtube-start', stop: 'youtube-stop' }
        };

        function switchMode(mode) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(mode + '-container').classList.add('active');
            event.currentTarget.classList.add('active');
            if(recognition) stopRec(mode === 'mic' ? 'youtube' : 'mic');
        }

        async function startAudioMeter(mode) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);

                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                const meterFill = document.getElementById(ui[mode].meter);

                function updateMeter() {
                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for(let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                    let average = sum / dataArray.length;
                    meterFill.style.width = Math.min(100, average * 2) + "%";
                    animationId = requestAnimationFrame(updateMeter);
                }
                updateMeter();
            } catch (err) {
                console.error("오디오 미터 에러:", err);
            }
        }

        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function startRec(mode) {
            if (!window.SpeechRecognition) return alert("브라우저 미지원");
            recognition = new SpeechRecognition();
            recognition.interimResults = true;
            recognition.lang = 'ko-KR';
            recognition.continuous = true;

            const finalSpan = document.getElementById(ui[mode].final);
            const interimSpan = document.getElementById(ui[mode].interim);
            const infoBanner = document.getElementById(ui[mode].info);

            recognition.onstart = () => {
                document.getElementById(ui[mode].start).disabled = true;
                document.getElementById(ui[mode].stop).disabled = false;
                infoBanner.innerHTML = "🟢 <strong>소리 감시 중...</strong> 에어팟으로 소리가 들리나요?";
                startAudioMeter(mode);
            };

            recognition.onerror = (event) => {
                infoBanner.innerHTML = "❌ <strong>에러:</strong> " + event.error;
            };

            recognition.onend = () => {
                document.getElementById(ui[mode].start).disabled = false;
                document.getElementById(ui[mode].stop).disabled = true;
                if(animationId) cancelAnimationFrame(animationId);
            };

            recognition.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalSpan.innerText += event.results[i][0].transcript + ' ';
                    else interim += event.results[i][0].transcript;
                }
                interimSpan.innerText = interim;
                const scrollArea = document.getElementById(ui[mode].scroll);
                scrollArea.scrollTop = scrollArea.scrollHeight;
                if (mode === 'youtube') updatePip(interim || finalSpan.innerText.split(' ').slice(-5).join(' '));
            };
            recognition.start();
        }

        function stopRec(mode) { if (recognition) recognition.stop(); }

        async function callAI(mode) {
            const text = document.getElementById(ui[mode].final).innerText;
            if (!text || text.length < 5) return alert("내용 부족");
            const aiBox = document.getElementById(ui[mode].ai);
            aiBox.innerText = "⏳ 요약 중...";
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await res.json();
                aiBox.innerHTML = `<strong>💡 요약:</strong>\n\n${data.result || data.error}`;
            } catch (err) { aiBox.innerText = "❌ 실패"; }
        }

        const canvas = document.getElementById('pip-canvas');
        const video = document.getElementById('pip-video');
        const ctx = canvas.getContext('2d');
        function updatePip(text) {
            ctx.fillStyle = "black"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ffff00"; ctx.font = "bold 35px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(text.length > 25 ? text.substring(text.length - 25) : text, canvas.width/2, 110);
        }
        async function togglePip() {
            try { video.srcObject = canvas.captureStream(); await video.play(); await video.requestPictureInPicture(); }
            catch (err) { alert("PIP 오류"); }
        }
        updatePip("준비 완료");
    </script>
</body>
</html>

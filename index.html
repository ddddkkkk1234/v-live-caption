<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V-Live Caption | AI 실시간 자막</title>
    <style>
        :root {
            --primary: #4CAF50;
            --ai-accent: #8E44AD;
            --danger: #f44336;
            --bg-color: #121212;
            --surface: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --nav-bg: #252525;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 5%;
            background-color: var(--surface);
            border-bottom: 1px solid #333;
        }

        .volume-meter {
            background: #000;
            padding: 5px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #333;
        }

        .v-bar { width: 80px; height: 8px; background: #222; border-radius: 4px; overflow: hidden; }
        .v-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.1s; }

        nav { display: flex; background-color: var(--nav-bg); padding: 0 5%; gap: 10px; }
        .nav-item { padding: 1.2rem 1rem; cursor: pointer; font-weight: bold; color: var(--text-muted); border-bottom: 4px solid transparent; transition: all 0.2s; }
        .nav-item.active { color: var(--primary); border-bottom-color: var(--primary); }

        .container { flex: 1; display: none; flex-direction: column; padding: 1rem; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; gap: 1rem; }
        .container.active { display: flex; }

        .card { background: var(--surface); border-radius: 16px; border: 1px solid #333; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        .card-header { padding: 1rem 1.2rem; background: rgba(255,255,255,0.05); border-bottom: 1px solid #333; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }

        .scroll-area { flex: 1; padding: 1.2rem; overflow-y: auto; height: 40vh; line-height: 1.8; font-size: 1.3rem; }
        
        .controls { display: flex; gap: 12px; justify-content: center; padding: 1rem 0; flex-wrap: wrap; }
        .btn { padding: 0.8rem 1.5rem; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 5px; }
        .btn-start { background: var(--primary); color: white; }
        .btn-stop { background: var(--danger); color: white; }
        .btn-ai { background: var(--ai-accent); color: white; }
        .btn-pip { background: #444; color: white; font-size: 0.75rem; padding: 5px 10px; }

        .selector-box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #444; display: flex; gap: 10px; flex-wrap: wrap; }
        .selector-item { flex: 1; min-width: 150px; }
        select { background: #333; color: white; border: 1px solid #555; padding: 8px; border-radius: 6px; width: 100%; margin-top: 5px; font-family: inherit; }

        #debug-log { background: #000; color: #0f0; font-family: monospace; font-size: 0.75rem; padding: 10px; height: 100px; overflow-y: auto; border: 1px solid #333; border-radius: 8px; margin-top: 10px; }

        footer { padding: 1rem; text-align: center; color: var(--text-muted); font-size: 0.8rem; }
        
        #pip-canvas { display: none; }
        #pip-video { display: none; }
    </style>
</head>
<body>

    <header>
        <h1 style="font-size: 1.2rem; margin:0;">🚀 V-Live Caption Pro</h1>
        <div class="volume-meter">
            <span style="font-size: 0.7rem;">감도:</span>
            <div class="v-bar"><div id="v-fill" class="v-fill"></div></div>
            <span id="v-label" style="font-size: 0.7rem;">0%</span>
        </div>
    </header>

    <nav>
        <div class="nav-item active" onclick="switchMode('youtube')">📺 실시간 자막</div>
        <div class="nav-item" onclick="switchMode('mic')">🎙️ 일반 기록</div>
    </nav>

    <div id="youtube-container" class="container active">
        <div class="selector-box">
            <div class="selector-item">
                <strong>🎤 마이크 선택</strong>
                <select id="device-select" onchange="initAudio()">
                    <option value="">불러오는 중...</option>
                </select>
            </div>
            <div class="selector-item">
                <strong>⚙️ STT 엔진</strong>
                <select id="engine-select">
                    <option value="web-speech">Web Speech API (무료/무제한)</option>
                    <option value="groq">Groq Whisper (고정밀/유료)</option>
                </select>
            </div>
            <div class="selector-item">
                <strong>🌐 언어 설정</strong>
                <select id="lang-select">
                    <option value="ko-KR">한국어 (KO)</option>
                    <option value="en-US">영어 (EN)</option>
                    <option value="auto">자동 감지</option>
                </select>
            </div>
        </div>

        <div class="content-grid">
            <div class="card">
                <div class="card-header">
                    <span>📺 실시간 자막 화면</span>
                    <button id="pip-btn" onclick="togglePIP()" class="btn btn-pip">📺 PIP 모드</button>
                </div>
                <div id="youtube-scroll" class="scroll-area" style="background:#000;">
                    <div id="youtube-text" style="color:#FFEB3B; font-weight:bold;"></div>
                </div>
            </div>
            <div class="card" style="border-color: var(--ai-accent);">
                <div class="card-header">🧠 AI 실시간 요약</div>
                <div class="scroll-area" id="youtube-ai" style="font-size:1rem;"></div>
            </div>
        </div>

        <div class="controls">
            <button onclick="startProRec()" id="pro-start" class="btn btn-start">🚀 자막 시작</button>
            <button onclick="stopProRec()" id="pro-stop" class="btn btn-stop" disabled>■ 중지</button>
            <button onclick="callAI()" class="btn btn-ai">✨ 요약하기</button>
        </div>

        <div id="debug-log">시스템 준비 완료...</div>
    </div>

    <!-- PIP용 요소 -->
    <canvas id="pip-canvas" width="800" height="200"></canvas>
    <video id="pip-video" autoplay playsinline muted></video>

    <script>
        let proInterval = null;
        let isProRunning = false;
        let audioContext = null;
        let stream = null;
        let recognition = null;
        
        const pipCanvas = document.getElementById('pip-canvas');
        const pipVideo = document.getElementById('pip-video');
        const pipCtx = pipCanvas.getContext('2d');

        const log = (msg, isError = false) => {
            const box = document.getElementById('debug-log');
            const color = isError ? '#ff5252' : '#0f0';
            box.innerHTML += `<span style="color:${color}">> ${msg}</span><br>`;
            box.scrollTop = box.scrollHeight;
        };

        async function initAudio() {
            try {
                if (audioContext) audioContext.close();
                const deviceId = document.getElementById('device-select').value;
                const constraints = { audio: { deviceId: deviceId ? { exact: deviceId } : undefined } };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                
                const devices = await navigator.mediaDevices.enumerateDevices();
                const mics = devices.filter(d => d.kind === 'audioinput');
                const select = document.getElementById('device-select');
                const currentVal = select.value;
                select.innerHTML = mics.map(m => `<option value="${m.deviceId}" ${m.deviceId === currentVal ? 'selected' : ''}>${m.label || '마이크'}</option>`).join('');

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                const data = new Uint8Array(analyser.frequencyBinCount);
                
                function draw() {
                    analyser.getByteFrequencyData(data);
                    let sum = 0; for(let i=0; i<data.length; i++) sum += data[i];
                    let avg = Math.round((sum / data.length) * 2.5);
                    document.getElementById('v-fill').style.width = Math.min(100, avg) + "%";
                    document.getElementById('v-label').innerText = Math.min(100, avg) + "%";
                    
                    updatePipCanvas();
                    if(audioContext.state !== 'closed') requestAnimationFrame(draw);
                }
                draw();
                log("마이크 활성화됨");
            } catch(e) { log("마이크 에러: " + e.message, true); }
        }
        initAudio();

        function updatePipCanvas() {
            pipCtx.fillStyle = "black";
            pipCtx.fillRect(0, 0, pipCanvas.width, pipCanvas.height);
            pipCtx.fillStyle = "#FFEB3B";
            pipCtx.font = "bold 40px Pretendard, sans-serif";
            pipCtx.textAlign = "center";
            const text = document.getElementById('youtube-text').innerText;
            const lastWords = text.split(' ').slice(-12).join(' ');
            pipCtx.fillText(lastWords, pipCanvas.width/2, pipCanvas.height/2 + 15);
        }

        async function togglePIP() {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    if (!pipVideo.srcObject) pipVideo.srcObject = pipCanvas.captureStream();
                    await pipVideo.play();
                    await pipVideo.requestPictureInPicture();
                }
            } catch (e) { log("PIP 에러: " + e.message, true); }
        }

        function switchMode(mode) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(mode + '-container').classList.add('active');
            stopProRec();
        }

        async function startProRec() {
            if (!stream) await initAudio();
            const engine = document.getElementById('engine-select').value;
            const lang = document.getElementById('lang-select').value;
            
            isProRunning = true;
            document.getElementById('pro-start').disabled = true;
            document.getElementById('pro-stop').disabled = false;
            
            log(`🚀 자막 생성 시작 (엔진: ${engine}, 언어: ${lang})`);

            if (engine === 'web-speech') {
                startWebSpeech(lang);
            } else {
                startGroqWhisper(lang);
            }
        }

        function startWebSpeech(lang) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                log("❌ 이 브라우저는 Web Speech API를 지원하지 않습니다.", true);
                stopProRec();
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = lang === 'auto' ? navigator.language : lang;

            recognition.onresult = (event) => {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    }
                }
                if (finalTranscript) {
                    document.getElementById('youtube-text').innerHTML += finalTranscript + " ";
                    document.getElementById('youtube-scroll').scrollTop = 99999;
                }
            };

            recognition.onend = () => {
                if (isProRunning) recognition.start();
            };

            recognition.onerror = (e) => log("WebSpeech 에러: " + e.error, true);
            recognition.start();
        }

        function startGroqWhisper(lang) {
            proInterval = setInterval(async () => {
                if (!isProRunning) return;
                const recorder = new MediaRecorder(stream);
                const chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    if (blob.size < 2500) return;
                    
                    const formData = new FormData();
                    formData.append('file', blob, 'audio.webm');
                    formData.append('model', 'whisper-large-v3');
                    if (lang !== 'auto') formData.append('language', lang.split('-')[0]);
                    
                    try {
                        const res = await fetch('/api/stt', { method: 'POST', body: formData });
                        const data = await res.json();
                        if (res.ok && data.text) {
                            const txt = data.text.trim();
                            if (txt && !txt.includes("감사합니다") && !txt.toLowerCase().includes("thank you")) {
                                document.getElementById('youtube-text').innerHTML += txt + " ";
                                document.getElementById('youtube-scroll').scrollTop = 99999;
                            }
                        }
                    } catch (e) { console.error(e); }
                };
                recorder.start();
                setTimeout(() => { if(recorder.state === 'recording') recorder.stop(); }, 3000);
            }, 3500);
        }

        function stopProRec() { 
            isProRunning = false; 
            if (proInterval) clearInterval(proInterval); 
            if (recognition) {
                recognition.onend = null;
                recognition.stop();
            }
            document.getElementById('pro-start').disabled = false; 
            document.getElementById('pro-stop').disabled = true; 
            log("⏹️ 자막 중지됨");
        }

        async function callAI() {
            const text = document.getElementById('youtube-text').innerText;
            if (text.length < 10) return log("⚠️ 요약할 내용이 부족합니다.", true);
            log("🧠 AI 요약 중...");
            try {
                const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text }) });
                const data = await res.json();
                document.getElementById('youtube-ai').innerHTML = data.result || "요약 실패";
                log("✅ 요약 완료");
            } catch (e) { log("❌ 요약 실패", true); }
        }
    </script>
</body>
</html>

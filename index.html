<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V-Live Caption | 고정밀 AI 자막</title>
    <style>
        :root {
            --primary: #4CAF50;
            --ai-accent: #8E44AD;
            --danger: #f44336;
            --bg-color: #121212;
            --surface: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --nav-bg: #252525;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 5%;
            background-color: var(--surface);
            border-bottom: 1px solid #333;
        }

        .volume-meter {
            background: #000;
            padding: 5px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #333;
        }

        .v-bar { width: 80px; height: 8px; background: #222; border-radius: 4px; overflow: hidden; }
        .v-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.1s; }

        nav { display: flex; background-color: var(--nav-bg); padding: 0 5%; gap: 10px; }
        .nav-item { padding: 1.2rem 1rem; cursor: pointer; font-weight: bold; color: var(--text-muted); border-bottom: 4px solid transparent; transition: all 0.2s; }
        .nav-item.active { color: var(--primary); border-bottom-color: var(--primary); }

        .container { flex: 1; display: none; flex-direction: column; padding: 1rem; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; gap: 1rem; }
        .container.active { display: flex; }

        .card { background: var(--surface); border-radius: 16px; border: 1px solid #333; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        .card-header { padding: 1rem 1.2rem; background: rgba(255,255,255,0.05); border-bottom: 1px solid #333; font-weight: bold; display: flex; justify-content: space-between; }

        .scroll-area { flex: 1; padding: 1.2rem; overflow-y: auto; height: 40vh; line-height: 1.8; font-size: 1.3rem; }
        
        .controls { display: flex; gap: 12px; justify-content: center; padding: 1rem 0; flex-wrap: wrap; }
        .btn { padding: 0.8rem 1.5rem; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-start { background: var(--primary); color: white; }
        .btn-stop { background: var(--danger); color: white; }
        .btn-ai { background: var(--ai-accent); color: white; }

        .selector-box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #444; }
        select { background: #333; color: white; border: 1px solid #555; padding: 8px; border-radius: 6px; width: 100%; margin-top: 10px; font-family: inherit; }

        #debug-log { background: #000; color: #0f0; font-family: monospace; font-size: 0.75rem; padding: 10px; height: 100px; overflow-y: auto; border: 1px solid #333; border-radius: 8px; margin-top: 10px; }

        footer { padding: 1rem; text-align: center; color: var(--text-muted); font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <h1 style="font-size: 1.2rem; margin:0;">🚀 V-Live Caption Pro</h1>
        <div class="volume-meter">
            <span style="font-size: 0.7rem;">감도:</span>
            <div class="v-bar"><div id="v-fill" class="v-fill"></div></div>
            <span id="v-label" style="font-size: 0.7rem;">0%</span>
        </div>
    </header>

    <nav>
        <div class="nav-item active" onclick="switchMode('youtube')">📺 2. 고정밀 자막(Pro)</div>
        <div class="nav-item" onclick="switchMode('mic')">🎙️ 1. 일반 기록</div>
    </nav>

    <div id="youtube-container" class="container active">
        <div class="selector-box">
            <strong>🎤 장치 선택</strong>
            <select id="device-select" onchange="initAudio()">
                <option value="">마이크 목록을 불러오는 중...</option>
            </select>
        </div>

        <div class="content-grid">
            <div class="card">
                <div class="card-header">📺 실시간 AI 자막</div>
                <div id="youtube-scroll" class="scroll-area" style="background:#000;">
                    <div id="youtube-text" style="color:#FFEB3B; font-weight:bold;"></div>
                </div>
            </div>
            <div class="card" style="border-color: var(--ai-accent);"><div class="card-header">🧠 AI 요약</div><div class="scroll-area" id="youtube-ai" style="font-size:1rem;"></div></div>
        </div>

        <div class="controls">
            <button onclick="startProRec()" id="pro-start" class="btn btn-start">🚀 자막 시작</button>
            <button onclick="stopProRec()" id="pro-stop" class="btn btn-stop" disabled>■ 중지</button>
            <button onclick="callAI('youtube')" class="btn btn-ai">✨ 요약하기</button>
        </div>

        <div id="debug-log">시스템 대기 중...</div>
    </div>

    <div id="mic-container" class="container">
        <div class="info-banner">일반 모드입니다.</div>
        <div class="content-grid">
            <div class="card"><div class="card-header">📝 기록</div><div id="mic-scroll" class="scroll-area"><span id="mic-final"></span></div></div>
            <div class="card"><div class="card-header">🧠 해석</div><div id="mic-ai" class="scroll-area"></div></div>
        </div>
    </div>

    <script>
        let proInterval = null;
        let isProRunning = false;
        let audioContext = null;
        let stream = null;

        const log = (msg, isError = false) => {
            const box = document.getElementById('debug-log');
            const color = isError ? 'red' : '#0f0';
            box.innerHTML += `<span style="color:${color}">> ${msg}</span><br>`;
            box.scrollTop = box.scrollHeight;
        };

        async function initAudio() {
            try {
                if (audioContext) audioContext.close();
                const deviceId = document.getElementById('device-select').value;
                const constraints = { audio: { deviceId: deviceId ? { exact: deviceId } : undefined, echoCancellation: false, noiseSuppression: false, autoGainControl: false } };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                
                const devices = await navigator.mediaDevices.enumerateDevices();
                const mics = devices.filter(d => d.kind === 'audioinput');
                const select = document.getElementById('device-select');
                const currentVal = select.value;
                select.innerHTML = mics.map(m => `<option value="${m.deviceId}" ${m.deviceId === currentVal ? 'selected' : ''}>${m.label || '마이크'}</option>`).join('');

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                const data = new Uint8Array(analyser.frequencyBinCount);
                
                function draw() {
                    analyser.getByteFrequencyData(data);
                    let sum = 0; for(let i=0; i<data.length; i++) sum += data[i];
                    let avg = Math.round((sum / data.length) * 2.5);
                    document.getElementById('v-fill').style.width = Math.min(100, avg) + "%";
                    document.getElementById('v-label').innerText = Math.min(100, avg) + "%";
                    if(audioContext.state !== 'closed') requestAnimationFrame(draw);
                }
                draw();
                log("마이크 연결됨: " + (mics.find(m => m.deviceId === deviceId)?.label || "기본값"));
            } catch(e) { log("마이크 에러: " + e.message, true); }
        }
        initAudio();

        function switchMode(mode) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(mode + '-container').classList.add('active');
            event.currentTarget.classList.add('active');
            stopProRec();
        }

        async function startProRec() {
            if (!stream) await initAudio();
            isProRunning = true;
            document.getElementById('pro-start').disabled = true;
            document.getElementById('pro-stop').disabled = false;
            log("🚀 Pro 자막 세션 시작 (3초 단위)...");

            proInterval = setInterval(async () => {
                if (!isProRunning) return;
                const recorder = new MediaRecorder(stream);
                const chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    if (blob.size < 2000) { log("⚠️ 무음 감지 (데이터 부족)"); return; }
                    
                    const formData = new FormData();
                    formData.append('file', blob, 'audio.webm');
                    formData.append('model', 'whisper-large-v3');
                    formData.append('language', 'ko');
                    
                    log(`📤 서버로 전송 중 (${Math.round(blob.size/1024)}KB)...`);
                        try {
                            const res = await fetch('/api/stt', { method: 'POST', body: formData });
                            const data = await res.json();
                            
                            if (res.ok && data.text && data.text.trim()) {
                                log(`📥 수신: "${data.text.substring(0, 20)}..."`);
                                document.getElementById('youtube-text').innerHTML += data.text + " ";
                                document.getElementById('youtube-scroll').scrollTop = 99999;
                            } else if (data.error) {
                                log(`❌ AI 에러: ${data.error}`, true);
                            } else {
                                // 만약 텍스트가 정말로 비어있다면 (무음 등)
                                log(`⚪ 음성 인식 결과 없음 (조용한 상태)`);
                            }
                        } catch (e) { log("❌ 네트워크 통신 실패", true); }
                };
                recorder.start();
                setTimeout(() => { if(recorder.state === 'recording') recorder.stop(); }, 3000);
            }, 3500);
        }

        function stopProRec() { 
            isProRunning = false; 
            clearInterval(proInterval); 
            document.getElementById('pro-start').disabled = false; 
            document.getElementById('pro-stop').disabled = true; 
            log("⏹️ 중지됨");
        }

        async function callAI(mode) {
            const text = document.getElementById('youtube-text').innerText;
            if (text.length < 5) return alert("자막 부족");
            log("🧠 AI 요약 요청 중...");
            try {
                const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text }) });
                const data = await res.json();
                document.getElementById('youtube-ai').innerHTML = data.result || data.error;
                log("✅ 요약 완료");
            } catch (e) { log("❌ 요약 실패", true); }
        }
    </script>
</body>
</html>

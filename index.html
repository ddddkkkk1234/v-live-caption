<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V-Live Caption Pro | 차세대 AI 실시간 자막</title>
    <style>
        :root {
            --primary: #00E676;
            --primary-dark: #00C853;
            --ai-accent: #D1C4E9;
            --ai-glow: #7C4DFF;
            --danger: #FF5252;
            --bg-dark: #0A0A0B;
            --surface: #161618;
            --surface-light: #222225;
            --text-main: #F5F5F7;
            --text-muted: #86868B;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            /* 사용자 설정 변수 */
            --caption-size: 1.4rem;
            --caption-color: #FFEB3B;
            --caption-opacity: 1;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background-color: rgba(10, 10, 11, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 10px; }
        .brand h1 { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.5px; margin: 0; background: linear-gradient(90deg, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: bold; background: var(--glass); border: 1px solid var(--border); display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #555; transition: all 0.3s; }
        .status-dot.active { background: var(--primary); box-shadow: 0 0 10px var(--primary); animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .volume-meter {
            background: var(--surface);
            padding: 6px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border);
        }
        .v-bar { width: 60px; height: 4px; background: #2A2A2E; border-radius: 2px; overflow: hidden; }
        .v-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), #81C784); transition: width 0.05s ease-out; }

        nav { display: flex; background: var(--bg-dark); padding: 0 5%; gap: 20px; border-bottom: 1px solid var(--border); }
        .nav-item { padding: 1rem 0.5rem; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; transition: all 0.3s; }
        .nav-item.active { color: var(--primary); border-bottom-color: var(--primary); }

        .container { flex: 1; display: none; flex-direction: column; padding: 1.5rem 5%; max-width: 1400px; margin: 0 auto; width: 100%; gap: 1.5rem; }
        .container.active { display: flex; }

        .selector-box { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 1rem; 
            background: var(--surface); 
            padding: 1.2rem; 
            border-radius: 16px; 
            border: 1px solid var(--border);
        }
        .selector-item { display: flex; flex-direction: column; gap: 8px; position: relative; }
        .selector-item label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        select, input[type="range"], input[type="color"] { 
            background: var(--surface-light); 
            color: var(--text-main); 
            border: 1px solid var(--border); 
            padding: 10px; 
            border-radius: 10px; 
            font-size: 0.85rem; 
            outline: none;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
        }
        select:disabled { opacity: 0.3; cursor: not-allowed; background: #111; }

        .device-hint { 
            position: absolute; 
            bottom: -18px; 
            left: 2px; 
            font-size: 0.6rem; 
            color: var(--primary); 
            font-weight: bold; 
            display: none; 
        }

        .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; flex: 1; min-height: 500px; }
        @media (max-width: 900px) { .content-grid { grid-template-columns: 1fr; } }

        .card { background: var(--surface); border-radius: 20px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .card-header { padding: 1.2rem; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .card-header h3 { margin: 0; font-size: 0.9rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }

        .scroll-area { 
            flex: 1; 
            padding: 1.5rem; 
            overflow-y: auto; 
            height: 55vh; 
            line-height: 1.6; 
            word-break: keep-all;
            background: radial-gradient(circle at top right, rgba(0,230,118,0.02), transparent);
        }
        
        #youtube-text { 
            font-size: var(--caption-size); 
            color: var(--caption-color); 
            opacity: var(--caption-opacity);
            font-weight: 700; 
            transition: all 0.2s; 
        }
        .interim { color: var(--text-muted); font-style: italic; }

        #youtube-ai { font-size: 0.95rem; color: #D1D1D6; line-height: 1.7; }

        .controls { display: flex; gap: 1rem; justify-content: center; padding: 1rem 0; flex-wrap: wrap; }
        .btn { 
            padding: 0.85rem 1.8rem; 
            border-radius: 14px; 
            border: none; 
            font-weight: 700; 
            font-size: 0.95rem;
            cursor: pointer; 
            transition: all 0.2s; 
            display: flex; 
            align-items: center; 
            gap: 8px;
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-start { background: var(--primary); color: #000; }
        .btn-stop { background: var(--surface-light); color: var(--danger); border: 1px solid rgba(255,82,82,0.1); }
        .btn-ai { background: linear-gradient(135deg, #7C4DFF, #D1C4E9); color: #fff; }
        .btn-download { background: var(--surface-light); color: var(--text-main); border: 1px solid var(--border); }
        .btn-pip { background: var(--surface-light); color: var(--text-main); font-size: 0.7rem; padding: 6px 12px; border: 1px solid var(--border); }

        #debug-log { 
            background: #000; 
            color: #4CAF50; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.7rem; 
            padding: 12px; 
            height: 120px; 
            overflow-y: auto; 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            opacity: 0.7;
        }

        #pip-canvas { display: none; }
        #pip-video { display: none; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>V-Live Caption <span style="color:var(--primary); font-weight:400;">PRO</span></h1>
            <div class="status-badge">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-text">시스템 준비됨</span>
            </div>
        </div>
        <div class="volume-meter">
            <span style="font-size: 0.65rem; font-weight:700; color:var(--text-muted);">마이크 감도 (Gain)</span>
            <div class="v-bar"><div id="v-fill" class="v-fill"></div></div>
            <span id="v-label" style="font-size: 0.65rem; font-weight:800; min-width:25px;">0%</span>
        </div>
    </header>

    <nav>
        <div class="nav-item active" onclick="switchMode('youtube')">실시간 세션 (Live)</div>
        <div class="nav-item" onclick="switchMode('mic')">기록 아카이브 (History)</div>
    </nav>

    <div id="youtube-container" class="container active">
        <!-- 설정 영역 -->
        <div class="selector-box">
            <div class="selector-item">
                <label>입력 장치 선택 (Input)</label>
                <select id="device-select" onchange="initAudio()"><option value="">장치 감지 중...</option></select>
                <span id="device-hint" class="device-hint">시스템 기본 마이크 강제 사용 중</span>
            </div>
            <div class="selector-item">
                <label>자막 모드 선택 (Mode)</label>
                <select id="engine-select" onchange="updateEngineUI()">
                    <option value="web-speech" selected>일반 자막 모드 (Standard)</option>
                    <option value="groq">고정밀 AI 모드 (Premium)</option>
                </select>
            </div>
            <div class="selector-item">
                <label>인식 언어 설정 (Lang)</label>
                <select id="lang-select">
                    <option value="ko-KR">한국어 (Korean)</option>
                    <option value="en-US">영어 (English)</option>
                    <option value="auto">언어 자동 감지</option>
                </select>
            </div>
            <div class="selector-item">
                <label>자막 글자 크기 (Size)</label>
                <input type="range" id="font-size-slider" min="1" max="4" step="0.1" value="1.4" oninput="updateStyle()">
            </div>
            <div class="selector-item">
                <label>자막 글자 색상 (Color)</label>
                <input type="color" id="text-color-picker" value="#FFEB3B" oninput="updateStyle()">
            </div>
        </div>

        <div class="content-grid">
            <div class="card">
                <div class="card-header">
                    <h3><span>📺</span> 실시간 자막 피드 (Transcript)</h3>
                    <div style="display:flex; gap:8px;">
                        <button onclick="clearTranscript()" class="btn btn-pip">기록 삭제</button>
                        <button onclick="togglePIP()" class="btn btn-pip">PIP 모드 켜기</button>
                    </div>
                </div>
                <div id="youtube-scroll" class="scroll-area">
                    <div id="youtube-text"></div>
                    <div id="interim-text" class="interim" style="display:inline; opacity:0.6;"></div>
                </div>
            </div>
            <div class="card" style="border-color: rgba(124, 77, 255, 0.3);">
                <div class="card-header"><h3><span>🧠</span> AI 실시간 분석 (AI Intel)</h3></div>
                <div class="scroll-area" id="youtube-ai"></div>
            </div>
        </div>

        <div class="controls">
            <button onclick="startProRec()" id="pro-start" class="btn btn-start">🚀 자막 생성 시작 (Start)</button>
            <button onclick="stopProRec()" id="pro-stop" class="btn btn-stop" disabled>■ 세션 종료 (Stop)</button>
            <button onclick="callAI()" class="btn btn-ai">✨ AI 실시간 요약 (Summarize)</button>
            <button onclick="downloadTranscript()" class="btn btn-download">📥 자막 다운로드 (.txt)</button>
        </div>

        <div id="debug-log">시스템이 준비되었습니다. Chrome/Edge 환경을 권장합니다.</div>
    </div>

    <canvas id="pip-canvas" width="800" height="200"></canvas>
    <video id="pip-video" autoplay playsinline muted></video>

    <script>
        let proInterval = null;
        let isProRunning = false;
        let audioContext = null;
        let stream = null;
        let recognition = null;
        let lastLoggedText = ""; 
        let restartTimer = null;
        
        const pipCanvas = document.getElementById('pip-canvas');
        const pipVideo = document.getElementById('pip-video');
        const pipCtx = pipCanvas.getContext('2d');

        function updateEngineUI() {
            const engine = document.getElementById('engine-select').value;
            const deviceSelect = document.getElementById('device-select');
            const deviceHint = document.getElementById('device-hint');

            if (engine === 'web-speech') {
                deviceSelect.disabled = true;
                deviceHint.style.display = 'block';
                log("[안내] 일반 모드는 브라우저 설정의 '기본 마이크'만 사용합니다.");
                initAudio(true); 
            } else {
                deviceSelect.disabled = false;
                deviceHint.style.display = 'none';
                log("[안내] 고정밀 모드는 선택한 장치에서 직접 소리를 추출합니다.");
            }
        }

        window.onload = () => {
            const saved = localStorage.getItem('vlive_transcript');
            if(saved) document.getElementById('youtube-text').innerText = saved;
            
            const savedSize = localStorage.getItem('vlive_font_size');
            if(savedSize) {
                document.getElementById('font-size-slider').value = savedSize;
                updateStyle();
            }
            const savedColor = localStorage.getItem('vlive_text_color');
            if(savedColor) {
                document.getElementById('text-color-picker').value = savedColor;
                updateStyle();
            }
            updateEngineUI(); 
        };

        function updateStyle() {
            const size = document.getElementById('font-size-slider').value + "rem";
            const color = document.getElementById('text-color-picker').value;
            document.documentElement.style.setProperty('--caption-size', size);
            document.documentElement.style.setProperty('--caption-color', color);
            localStorage.setItem('vlive_font_size', document.getElementById('font-size-slider').value);
            localStorage.setItem('vlive_text_color', color);
        }

        function clearTranscript() {
            if(confirm("기록을 삭제할까요?")) {
                document.getElementById('youtube-text').innerText = "";
                document.getElementById('interim-text').innerText = "";
                localStorage.removeItem('vlive_transcript');
                log("기록 초기화 완료.");
            }
        }

        function downloadTranscript() {
            const text = document.getElementById('youtube-text').innerText;
            if(!text) return alert("다운로드할 자막이 없습니다.");
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const now = new Date();
            a.download = `V-Live_자막_${now.getHours()}${now.getMinutes()}.txt`;
            a.click();
            log("자막 추출 완료.");
        }

        const log = (msg, isError = false) => {
            const box = document.getElementById('debug-log');
            const color = isError ? '#FF5252' : '#00E676';
            box.innerHTML += `<span style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</span><br>`;
            box.scrollTop = box.scrollHeight;
        };

        const setStatus = (status, active = false) => {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            text.innerText = status.toUpperCase();
            if(active) dot.classList.add('active'); else dot.classList.remove('active');
        };

        function cleanText(text) {
            const noise = ["감사합니다", "thank you", "어..", "음..", "어...", "감사합니다.", "Thank you."];
            let cleaned = text.trim();
            if(!cleaned) return "";
            if(noise.some(n => cleaned.toLowerCase() === n)) return "";
            if(cleaned === lastLoggedText) return ""; 
            lastLoggedText = cleaned;
            return cleaned;
        }

        async function initAudio(useDefault = false) {
            try {
                if (audioContext) audioContext.close();
                let deviceId = document.getElementById('device-select').value;
                if (useDefault) deviceId = undefined; 

                const constraints = { 
                    audio: { 
                        deviceId: deviceId ? { exact: deviceId } : undefined, 
                        autoGainControl: false, 
                        echoCancellation: false,
                        noiseSuppression: false
                    } 
                };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                
                const devices = await navigator.mediaDevices.enumerateDevices();
                const mics = devices.filter(d => d.kind === 'audioinput');
                const select = document.getElementById('device-select');
                const currentVal = select.value;
                select.innerHTML = mics.map(m => `<option value="${m.deviceId}" ${m.deviceId === (useDefault ? mics[0]?.deviceId : currentVal) ? 'selected' : ''}>${m.label || '기본 마이크'}</option>`).join('');

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') await audioContext.resume();

                const source = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                analyser.smoothingTimeConstant = 0.4;
                source.connect(analyser);
                const data = new Uint8Array(analyser.frequencyBinCount);
                
                function draw() {
                    analyser.getByteFrequencyData(data);
                    let sum = 0; for(let i=0; i<data.length; i++) sum += data[i];
                    let avg = Math.round((sum / data.length) * 4.8); 
                    document.getElementById('v-fill').style.width = Math.min(100, avg) + "%";
                    document.getElementById('v-label').innerText = Math.min(100, avg) + "%";
                    updatePipCanvas();
                    if(audioContext.state !== 'closed') requestAnimationFrame(draw);
                }
                draw();
                setStatus("준비 완료", false);
            } catch(e) { log("마이크 연결 실패: " + e.message, true); }
        }
        initAudio();

        function updatePipCanvas() {
            pipCtx.fillStyle = "black";
            pipCtx.fillRect(0, 0, pipCanvas.width, pipCanvas.height);
            pipCtx.fillStyle = document.getElementById('text-color-picker').value;
            const fontSize = parseFloat(document.getElementById('font-size-slider').value) * 32;
            pipCtx.font = `bold ${fontSize}px Pretendard, sans-serif`;
            pipCtx.textAlign = "center";
            
            const mainText = document.getElementById('youtube-text').innerText;
            const interimText = document.getElementById('interim-text').innerText;
            const fullText = (mainText + " " + interimText).trim();
            const words = fullText.split(' ');
            const lastWords = words.slice(-8).join(' ');
            pipCtx.fillText(lastWords, pipCanvas.width/2, pipCanvas.height/2 + 15);
        }

        async function togglePIP() {
            try {
                if (document.pictureInPictureElement) await document.exitPictureInPicture();
                else {
                    if (!pipVideo.srcObject) pipVideo.srcObject = pipCanvas.captureStream();
                    await pipVideo.play();
                    await pipVideo.requestPictureInPicture();
                }
            } catch (e) { log("PIP 에러: " + e.message, true); }
        }

        function switchMode(mode) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(mode + '-container').classList.add('active');
            stopProRec();
        }

        async function startProRec() {
            if (!stream) await initAudio();
            const engine = document.getElementById('engine-select').value;
            const lang = document.getElementById('lang-select').value;
            isProRunning = true;
            document.getElementById('pro-start').disabled = true;
            document.getElementById('pro-stop').disabled = false;
            setStatus("자막 캡처 중", true);
            
            log(`[시스템] 엔진 가동: ${engine}`);

            if (engine === 'web-speech') startWebSpeech(lang);
            else startGroqWhisper(lang);
        }

        function startWebSpeech(lang) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                log("음성 인식을 지원하지 않는 브라우저입니다.", true);
                stopProRec();
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true; 
            recognition.lang = lang === 'auto' ? (navigator.language || 'ko-KR') : lang;

            log(`[일반 모드] 음성 인식 시작 (언어: ${recognition.lang})`);

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }

                const interimEl = document.getElementById('interim-text');
                interimEl.innerText = interimTranscript;

                if (finalTranscript) {
                    const cleaned = cleanText(finalTranscript);
                    if(cleaned) {
                        const textEl = document.getElementById('youtube-text');
                        textEl.innerText += cleaned + " ";
                        localStorage.setItem('vlive_transcript', textEl.innerText);
                        document.getElementById('youtube-scroll').scrollTop = 999999;
                        log(`[인식 성공] ${cleaned.substring(0, 15)}...`);
                    }
                }
            };

            recognition.onerror = (e) => {
                if (e.error === 'no-speech') {
                    // 침묵 타임아웃일 땐 로그만 남기고 무시 (자동 재시작 유도)
                    console.log("[Web STT] Silence timeout.");
                } else {
                    log(`[일반 모드 에러] ${e.error}`, true);
                }
            };

            recognition.onend = () => {
                if (isProRunning) {
                    // 침묵으로 인해 꺼진 경우 1초 뒤 즉시 재시작
                    if(restartTimer) clearTimeout(restartTimer);
                    restartTimer = setTimeout(() => {
                        if(isProRunning) {
                            try { recognition.start(); log("[시스템] 엔진 재연결됨"); } catch(err) {}
                        }
                    }, 1000);
                }
            };

            try {
                recognition.start();
            } catch(e) { console.error(e); }
        }

        function startGroqWhisper(lang) {
            log("[Premium] 고정밀 엔진 가동 (3.5초 간격)");
            proInterval = setInterval(async () => {
                if (!isProRunning) return;
                const recorder = new MediaRecorder(stream);
                const chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    if (blob.size < 2500) return;
                    const formData = new FormData();
                    formData.append('file', blob, 'audio.webm');
                    formData.append('model', 'whisper-large-v3');
                    if (lang !== 'auto') formData.append('language', lang.split('-')[0]);
                    try {
                        const res = await fetch('/api/stt', { method: 'POST', body: formData });
                        const data = await res.json();
                        if (res.ok && data.text) {
                            const cleaned = cleanText(data.text);
                            if (cleaned) {
                                const textEl = document.getElementById('youtube-text');
                                textEl.innerText += cleaned + " ";
                                localStorage.setItem('vlive_transcript', textEl.innerText);
                                document.getElementById('youtube-scroll').scrollTop = 999999;
                            }
                        }
                    } catch (e) { console.error(e); }
                };
                recorder.start();
                setTimeout(() => { if(recorder.state === 'recording') recorder.stop(); }, 3000);
            }, 3500);
        }

        function stopProRec() { 
            isProRunning = false; 
            if (proInterval) clearInterval(proInterval); 
            if(restartTimer) clearTimeout(restartTimer);
            if (recognition) {
                recognition.onend = null;
                try { recognition.stop(); } catch(e) {}
            }
            document.getElementById('pro-start').disabled = false; 
            document.getElementById('pro-stop').disabled = true; 
            document.getElementById('interim-text').innerText = "";
            setStatus("세션 중단됨", false);
            log("모든 자막 세션이 종료되었습니다.");
        }

        async function callAI() {
            const text = document.getElementById('youtube-text').innerText;
            if (text.length < 10) return log("분석할 자막 데이터가 충분하지 않습니다.", true);
            log("AI가 실시간 분석을 시작합니다...");
            setStatus("AI 분석 중", true);
            try {
                const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text }) });
                const data = await res.json();
                document.getElementById('youtube-ai').innerHTML = data.result || "AI 분석에 실패했습니다.";
                log("분석 완료.");
            } catch (e) { log("AI 요청 중 오류 발생.", true); }
            finally { if(isProRunning) setStatus("자막 캡처 중", true); else setStatus("세션 중단됨", false); }
        }
    </script>
</body>
</html>

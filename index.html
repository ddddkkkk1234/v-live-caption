<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V-Live Caption | AI 실시간 자막 & 해석</title>
    <meta name="description" content="마이크 받아쓰기부터 유튜브 실시간 자막까지, AI가 의도를 해석해줍니다.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">

    <style>
        :root {
            --primary: #4CAF50;
            --ai-accent: #8E44AD;
            --danger: #f44336;
            --bg-color: #121212;
            --surface: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --nav-bg: #252525;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* 메뉴바 스타일 */
        nav {
            display: flex;
            background-color: var(--nav-bg);
            padding: 0 5%;
            border-bottom: 1px solid #333;
            gap: 20px;
        }

        .nav-item {
            padding: 1rem 0.5rem;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-muted);
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-item.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 5%;
            background-color: var(--surface);
        }

        .container {
            flex: 1;
            display: none; /* 기본적으로 숨김 */
            flex-direction: column;
            padding: 1rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            gap: 1rem;
        }

        .container.active { display: flex; }

        /* 카드 레이아웃 */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            flex: 1;
        }

        @media (max-width: 800px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .card-header {
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid #333;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scroll-area {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            height: 45vh;
            line-height: 1.6;
        }

        .final-text { color: var(--text-main); font-size: 1.2rem; }
        .interim-text { color: var(--text-muted); font-size: 1.2rem; font-style: italic; }
        .ai-result { color: #d1b3ff; font-size: 1.1rem; white-space: pre-wrap; }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            padding: 1rem 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-start { background: var(--primary); color: white; }
        .btn-stop { background: var(--danger); color: white; }
        .btn-ai { background: var(--ai-accent); color: white; }
        .btn-pip { background: #3498db; color: white; }

        .status-bar {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            padding: 0.6rem;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }

        /* PIP용 캔버스 (숨김) */
        #pip-canvas { display: none; }
        #pip-video { display: none; }

        footer {
            padding: 1rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: var(--surface);
        }

        .typing::after {
            content: "|";
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <header>
        <h1 style="font-size: 1.2rem; margin:0;">🎙️ V-Live Caption</h1>
        <button class="btn" style="background:#333; border:1px solid #555; font-size:0.8rem;">로그인</button>
    </header>

    <nav>
        <div class="nav-item active" onclick="switchMode('mic')">🎙️ 마이크 모드</div>
        <div class="nav-item" onclick="switchMode('youtube')">📺 유튜브/시스템 모드</div>
    </nav>

    <!-- 모드 1: 마이크 받아쓰기 -->
    <div id="mic-container" class="container active">
        <div class="status-bar" id="mic-status">마이크 버튼을 눌러 내 목소리를 기록하세요.</div>
        <div class="content-grid">
            <div class="card">
                <div class="card-header">📝 실시간 내 목소리</div>
                <div class="scroll-area" id="mic-scroll">
                    <span id="mic-final" class="final-text"></span>
                    <span id="mic-interim" class="interim-text typing"></span>
                </div>
            </div>
            <div class="card" style="border-color: var(--ai-accent);">
                <div class="card-header" style="color: #d1b3ff;">🧠 AI 의도 해석</div>
                <div class="scroll-area">
                    <div id="mic-ai" class="ai-result">대화가 쌓이면 AI 해석 버튼을 눌러보세요.</div>
                </div>
            </div>
        </div>
        <div class="controls">
            <button onclick="startRecognition('mic')" id="mic-start" class="btn btn-start">▶ 시작하기</button>
            <button onclick="stopRecognition('mic')" id="mic-stop" class="btn btn-stop" disabled>■ 중지하기</button>
            <button onclick="getAIInterpretation('mic')" class="btn btn-ai">✨ AI 해석하기</button>
        </div>
    </div>

    <!-- 모드 2: 유튜브/시스템 자막 -->
    <div id="youtube-container" class="container">
        <div class="status-bar" id="youtube-status">
            유튜브 소리를 자막으로 보려면 <strong>'스테레오 믹스'</strong> 설정이 권장됩니다.
        </div>
        <div class="content-grid">
            <div class="card">
                <div class="card-header">
                    📺 실시간 시스템 소리
                    <button id="pip-btn" class="btn btn-pip" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">🗗 항상 위로 (PIP)</button>
                </div>
                <div class="scroll-area" id="youtube-scroll" style="background: #000;">
                    <span id="youtube-final" class="final-text"></span>
                    <span id="youtube-interim" class="interim-text typing" style="color: #ffff00;"></span>
                </div>
            </div>
            <div class="card" style="border-color: var(--ai-accent);">
                <div class="card-header" style="color: #d1b3ff;">🧠 실시간 요약/해석</div>
                <div class="scroll-area">
                    <div id="youtube-ai" class="ai-result">유튜브 영상의 핵심 내용을 AI가 짚어줍니다.</div>
                </div>
            </div>
        </div>
        <div class="controls">
            <button onclick="startRecognition('youtube')" id="youtube-start" class="btn btn-start">▶ 유튜브 자막 시작</button>
            <button onclick="stopRecognition('youtube')" id="youtube-stop" class="btn btn-stop" disabled>■ 중지하기</button>
            <button onclick="getAIInterpretation('youtube')" class="btn btn-ai">✨ 핵심 요약하기</button>
        </div>
    </div>

    <!-- PIP 구현용 캔버스 및 비디오 (숨김) -->
    <canvas id="pip-canvas" width="600" height="200"></canvas>
    <video id="pip-video" autoplay muted playsinline></video>

    <footer>
        &copy; 2026 V-Live Caption | <a href="#" style="color:inherit;">이용약관</a>
    </footer>

    <script>
        let currentMode = 'mic';
        let recognition = null;
        const modes = {
            mic: {
                final: document.getElementById('mic-final'),
                interim: document.getElementById('mic-interim'),
                status: document.getElementById('mic-status'),
                ai: document.getElementById('mic-ai'),
                scroll: document.getElementById('mic-scroll'),
                startBtn: document.getElementById('mic-start'),
                stopBtn: document.getElementById('mic-stop')
            },
            youtube: {
                final: document.getElementById('youtube-final'),
                interim: document.getElementById('youtube-interim'),
                status: document.getElementById('youtube-status'),
                ai: document.getElementById('youtube-ai'),
                scroll: document.getElementById('youtube-scroll'),
                startBtn: document.getElementById('youtube-start'),
                stopBtn: document.getElementById('youtube-stop')
            }
        };

        // 모드 전환 함수
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(mode + '-container').classList.add('active');
            event.currentTarget.classList.add('active');
            
            if(recognition) stopRecognition(mode === 'mic' ? 'youtube' : 'mic');
        }

        // Web Speech API 초기화
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function startRecognition(mode) {
            if (!window.SpeechRecognition) {
                alert("이 브라우저는 음성 인식을 지원하지 않습니다.");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.interimResults = true;
            recognition.lang = 'ko-KR';
            recognition.continuous = true;

            recognition.onstart = () => {
                modes[mode].status.innerText = "🟢 실시간 인식 중... (소리를 들려주세요)";
                modes[mode].startBtn.disabled = true;
                modes[mode].stopBtn.disabled = false;
            };

            recognition.onend = () => {
                modes[mode].status.innerText = "⚪ 대기 중";
                modes[mode].startBtn.disabled = false;
                modes[mode].stopBtn.disabled = true;
            };

            recognition.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        modes[mode].final.innerText += event.results[i][0].transcript + ' ';
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                modes[mode].interim.innerText = interim;
                modes[mode].scroll.scrollTop = modes[mode].scroll.scrollHeight;
                
                // 유튜브 모드일 때 PIP 캔버스 업데이트
                if (mode === 'youtube') updatePipCanvas(interim || modes[mode].final.innerText.split(' ').slice(-5).join(' '));
            };

            recognition.start();
        }

        function stopRecognition(mode) {
            if (recognition) recognition.stop();
        }

        // AI 해석 API 호출
        async function getAIInterpretation(mode) {
            const text = modes[mode].final.innerText;
            if (!text || text.length < 5) {
                alert("해석할 내용이 부족합니다.");
                return;
            }

            modes[mode].ai.innerText = "⏳ AI가 분석 중입니다...";
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await response.json();
                modes[mode].ai.innerHTML = `<strong>💡 AI 해석 결과:</strong>\n\n${data.result || data.error}`;
            } catch (err) {
                modes[mode].ai.innerText = "❌ AI 연결 실패";
            }
        }

        // --- PIP (Picture-in-Picture) 기능 ---
        const pipCanvas = document.getElementById('pip-canvas');
        const pipVideo = document.getElementById('pip-video');
        const ctx = pipCanvas.getContext('2d');

        function updatePipCanvas(text) {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, pipCanvas.width, pipCanvas.height);
            ctx.fillStyle = "yellow";
            ctx.font = "bold 30px Pretendard";
            ctx.textAlign = "center";
            
            // 텍스트 줄바꿈 처리
            const words = text.split(' ');
            let line = '';
            let y = 100;
            for(let n = 0; n < words.length; n++) {
                line += words[n] + ' ';
                if(line.length > 20) {
                    ctx.fillText(line, pipCanvas.width/2, y);
                    line = '';
                    y += 40;
                }
            }
            ctx.fillText(line, pipCanvas.width/2, y);
        }

        document.getElementById('pip-btn').onclick = async () => {
            try {
                const stream = pipCanvas.captureStream();
                pipVideo.srcObject = stream;
                await pipVideo.play();
                await pipVideo.requestPictureInPicture();
            } catch (err) {
                alert("PIP 모드를 시작할 수 없습니다. (크롬 브라우저 권장)");
            }
        };

        // 초기 캔버스 셋팅
        updatePipCanvas("자막 대기 중...");
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 실시간 받아쓰기 (Live Caption)</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #caption-container {
            width: 80%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.7);
            padding: 2rem;
            border-radius: 12px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            margin-bottom: 2rem;
        }

        #final-text {
            color: #ffffff;
            font-size: 1.5rem;
            line-height: 1.6;
        }

        #interim-text {
            color: #aaaaaa;
            font-size: 1.5rem;
            line-height: 1.6;
            font-style: italic;
        }

        .controls {
            display: flex;
            gap: 1rem;
        }

        button {
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        #start-btn {
            background-color: #4CAF50;
            color: white;
        }

        #start-btn:hover {
            background-color: #45a049;
        }

        #stop-btn {
            background-color: #f44336;
            color: white;
        }

        #stop-btn:hover {
            background-color: #da190b;
        }

        #status {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #888;
        }

        /* 스크롤바 스타일 */
        #caption-container::-webkit-scrollbar {
            width: 6px;
        }
        #caption-container::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>AI Live Caption</h1>
    
    <div id="caption-container">
        <span id="final-text"></span>
        <span id="interim-text"></span>
    </div>

    <div class="controls">
        <button id="start-btn">시작하기</button>
        <button id="stop-btn" disabled style="background-color: #555;">중지하기</button>
    </div>

    <p id="status">마이크 권한을 허용하고 시작 버튼을 눌러주세요.</p>

    <script>
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const finalTextSpan = document.getElementById('final-text');
        const interimTextSpan = document.getElementById('interim-text');
        const statusText = document.getElementById('status');
        const captionContainer = document.getElementById('caption-container');

        // Web Speech API 설정
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        let recognition = null;

        if (window.SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.interimResults = true; // 중간 결과 표시
            recognition.lang = 'ko-KR'; // 언어 설정 (한국어)
            recognition.continuous = true; // 연속 인식

            recognition.onstart = () => {
                statusText.innerText = '음성 인식 중...';
                startBtn.disabled = true;
                startBtn.style.backgroundColor = '#555';
                stopBtn.disabled = false;
                stopBtn.style.backgroundColor = '#f44336';
            };

            recognition.onend = () => {
                statusText.innerText = '음성 인식이 종료되었습니다.';
                startBtn.disabled = false;
                startBtn.style.backgroundColor = '#4CAF50';
                stopBtn.disabled = true;
                stopBtn.style.backgroundColor = '#555';
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTextSpan.innerText += event.results[i][0].transcript + ' ';
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                interimTextSpan.innerText = interimTranscript;
                
                // 자동 스크롤
                captionContainer.scrollTop = captionContainer.scrollHeight;
            };

            recognition.onerror = (event) => {
                console.error('Recognition error:', event.error);
                statusText.innerText = '에러 발생: ' + event.error;
            };

        } else {
            statusText.innerText = '이 브라우저는 음성 인식을 지원하지 않습니다. (Chrome 권장)';
            startBtn.disabled = true;
        }

        startBtn.onclick = () => {
            finalTextSpan.innerText = '';
            recognition.start();
        };

        stopBtn.onclick = () => {
            recognition.stop();
        };
    </script>
</body>
</html>

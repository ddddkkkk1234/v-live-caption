<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V-Live Caption | AI 실시간 해석</title>
    <meta name="description" content="AI가 실시간으로 음성을 받아쓰고, 그 의도까지 해석해줍니다.">
    <meta property="og:title" content="V-Live Caption | AI 실시간 해석">
    <meta property="og:description" content="단순한 받아쓰기를 넘어, AI가 대화의 핵심을 짚어줍니다.">
    <meta property="og:image" content="https://via.placeholder.com/800x400/1a1a1a/ffffff?text=AI+Live+Caption">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">

    <style>
        :root {
            --primary: #4CAF50;
            --ai-accent: #8E44AD; /* AI 해석 강조색 (보라색) */
            --danger: #f44336;
            --bg-color: #121212;
            --surface: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background-color: var(--surface);
            border-bottom: 1px solid #333;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            gap: 1rem;
        }

        /* 메인 레이아웃: 받아쓰기와 AI 해석을 나란히 (PC) / 위아래 (모바일) */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            flex: 1;
        }

        @media (max-width: 800px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .card-header {
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid #333;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .scroll-area {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            height: 40vh;
            line-height: 1.6;
        }

        #final-text { color: var(--text-main); font-size: 1.1rem; }
        #interim-text { color: var(--text-muted); font-size: 1.1rem; font-style: italic; }

        /* AI 해석 스타일 */
        #ai-interpretation {
            color: #d1b3ff;
            font-size: 1.1rem;
            white-space: pre-wrap;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            padding: 1rem 0;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-start { background: var(--primary); color: white; }
        .btn-stop { background: var(--danger); color: white; }
        .btn-ai { background: var(--ai-accent); color: white; }

        .status-bar {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            padding: 0.5rem;
            background: rgba(0,0,0,0.2);
            border-radius: 5px;
        }

        footer {
            padding: 1rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: var(--surface);
        }

        /* 애니메이션 효과 */
        .typing::after {
            content: "|";
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <header>
        <h1>🎙️ V-Live Caption</h1>
        <button class="btn" style="background:#333; border:1px solid #555; font-size:0.8rem;">로그인</button>
    </header>

    <div class="container">
        <div class="status-bar" id="status-bar">마이크 버튼을 눌러 시작하세요.</div>

        <div class="content-grid">
            <!-- 1. 받아쓰기 카드 -->
            <div class="card">
                <div class="card-header">📝 실시간 받아쓰기</div>
                <div class="scroll-area" id="caption-scroll">
                    <span id="final-text"></span>
                    <span id="interim-text" class="typing"></span>
                </div>
            </div>

            <!-- 2. AI 해석 카드 -->
            <div class="card" style="border-color: var(--ai-accent);">
                <div class="card-header" style="color: #d1b3ff;">🧠 AI 의도 해석</div>
                <div class="scroll-area" id="ai-scroll">
                    <div id="ai-interpretation">사용자가 말을 하면 AI가 요점과 의도를 분석하여 이곳에 표시합니다.</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="start-btn" class="btn btn-start">▶ 시작하기</button>
            <button id="stop-btn" class="btn btn-stop" disabled>■ 중지하기</button>
            <button id="ai-btn" class="btn btn-ai">✨ AI 해석하기</button>
        </div>
    </div>

    <footer>
        &copy; 2026 V-Live Caption | <a href="#" style="color:inherit;">문의하기</a>
    </footer>

    <script>
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const aiBtn = document.getElementById('ai-btn');
        const finalTextSpan = document.getElementById('final-text');
        const interimTextSpan = document.getElementById('interim-text');
        const aiBox = document.getElementById('ai-interpretation');
        const statusBar = document.getElementById('status-bar');
        const captionScroll = document.getElementById('caption-scroll');

        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (window.SpeechRecognition) {
            recognition = new RecognitionHelper();
        } else {
            statusBar.innerText = "이 브라우저는 음성 인식을 지원하지 않습니다.";
            startBtn.disabled = true;
        }

        function RecognitionHelper() {
            const rec = new SpeechRecognition();
            rec.interimResults = true;
            rec.lang = 'ko-KR';
            rec.continuous = true;

            rec.onstart = () => {
                statusBar.innerText = "🟢 실시간 인식 중...";
                startBtn.disabled = true;
                stopBtn.disabled = false;
            };

            rec.onend = () => {
                statusBar.innerText = "⚪ 대기 중";
                startBtn.disabled = false;
                stopBtn.disabled = true;
            };

            rec.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTextSpan.innerText += event.results[i][0].transcript + ' ';
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                interimTextSpan.innerText = interim;
                captionScroll.scrollTop = captionScroll.scrollHeight;
            };

            return rec;
        }

        startBtn.onclick = () => recognition.start();
        stopBtn.onclick = () => recognition.stop();

        // AI 해석 기능 (실제 API 호출 버전)
        aiBtn.onclick = async () => {
            const text = finalTextSpan.innerText;
            if (!text || text.length < 5) {
                alert("해석할 내용이 부족합니다. 좀 더 말씀해 주세요!");
                return;
            }

            aiBox.innerText = "⏳ AI가 의도를 분석 중입니다...";
            aiBtn.disabled = true;
            
            try {
                // Cloudflare Functions API 호출
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();
                
                if (data.result) {
                    aiBox.innerHTML = `<strong>💡 AI 해석 결과:</strong>\n\n${data.result}`;
                } else if (data.error) {
                    aiBox.innerText = "❌ 오류: " + data.error;
                }
            } catch (err) {
                console.error(err);
                aiBox.innerText = "❌ AI 연결 실패. API 키 설정을 확인해주세요.";
            } finally {
                aiBtn.disabled = false;
            }
        };
    </script>
</body>
</html>

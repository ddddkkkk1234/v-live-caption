<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V-Live Caption Pro | 차세대 AI 실시간 자막</title>
    <style>
        :root {
            --primary: #00E676;
            --primary-dark: #00C853;
            --ai-accent: #D1C4E9;
            --ai-glow: #7C4DFF;
            --danger: #FF5252;
            --bg-dark: #0A0A0B;
            --surface: #161618;
            --surface-light: #222225;
            --text-main: #F5F5F7;
            --text-muted: #86868B;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --caption-size: 1.4rem;
            --caption-color: #FFEB3B;
            --caption-opacity: 1;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background-color: rgba(10, 10, 11, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 10px; }
        .brand h1 { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.5px; margin: 0; background: linear-gradient(90deg, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: bold; background: var(--glass); border: 1px solid var(--border); display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #555; transition: all 0.3s; }
        .status-dot.active { background: var(--primary); box-shadow: 0 0 10px var(--primary); animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .volume-meter {
            background: var(--surface);
            padding: 6px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border);
        }
        .v-bar { width: 60px; height: 4px; background: #2A2A2E; border-radius: 2px; overflow: hidden; }
        .v-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), #81C784); transition: width 0.05s ease-out; }

        nav { display: flex; background: var(--bg-dark); padding: 0 5%; gap: 20px; border-bottom: 1px solid var(--border); }
        .nav-item { padding: 1rem 0.5rem; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; transition: all 0.3s; }
        .nav-item.active { color: var(--primary); border-bottom-color: var(--primary); }

        .container { flex: 1; display: none; flex-direction: column; padding: 1.5rem 5%; max-width: 1400px; margin: 0 auto; width: 100%; gap: 1.5rem; }
        .container.active { display: flex; }

        .selector-box { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 1rem; 
            background: var(--surface); 
            padding: 1.2rem; 
            border-radius: 16px; 
            border: 1px solid var(--border);
        }
        .selector-item { display: flex; flex-direction: column; gap: 8px; position: relative; }
        .selector-item label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        select, input[type="range"], input[type="color"] { 
            background: var(--surface-light); 
            color: var(--text-main); 
            border: 1px solid var(--border); 
            padding: 10px; 
            border-radius: 10px; 
            font-size: 0.85rem; 
            outline: none;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
        }
        select:disabled { opacity: 0.3; cursor: not-allowed; background: #111; }

        .device-hint { 
            position: absolute; 
            bottom: -18px; 
            left: 2px; 
            font-size: 0.6rem; 
            color: var(--primary); 
            font-weight: bold; 
            display: none; 
        }

        .content-grid { display: grid; grid-template-columns: 2fr 1.2fr; gap: 1.5rem; flex: 1; min-height: 550px; }
        @media (max-width: 900px) { .content-grid { grid-template-columns: 1fr; } }

        .card { background: var(--surface); border-radius: 20px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .card-header { padding: 1.2rem; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .card-header h3 { margin: 0; font-size: 0.9rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }

        .scroll-area { 
            flex: 1; 
            padding: 1.5rem; 
            overflow-y: auto; 
            height: 55vh; 
            line-height: 1.6; 
            word-break: keep-all;
            background: radial-gradient(circle at top right, rgba(0,230,118,0.02), transparent);
        }
        
        #youtube-text { font-size: var(--caption-size); color: var(--caption-color); opacity: var(--caption-opacity); font-weight: 700; transition: all 0.2s; }
        .interim { color: var(--text-muted); font-style: italic; }

        .chat-container { display: flex; flex-direction: column; height: 100%; }
        #youtube-ai { flex: 1; font-size: 0.95rem; color: #D1D1D6; line-height: 1.7; padding-bottom: 10px; }
        .chat-input-box { display: flex; gap: 8px; padding: 12px; background: var(--surface-light); border-top: 1px solid var(--border); }
        .chat-input-box input { flex: 1; background: var(--bg-dark); border: 1px solid var(--border); color: white; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; outline: none; }
        .chat-input-box input:focus { border-color: var(--primary); }
        .btn-send { background: var(--primary); color: #000; padding: 6px 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 0.75rem; }

        .controls { display: flex; gap: 1rem; justify-content: center; padding: 1rem 0; flex-wrap: wrap; }
        .btn { padding: 0.85rem 1.8rem; border-radius: 14px; border: none; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-start { background: var(--primary); color: #000; }
        .btn-stop { background: var(--surface-light); color: var(--danger); border: 1px solid rgba(255,82,82,0.1); }
        .btn-download { background: var(--surface-light); color: var(--text-main); border: 1px solid var(--border); }
        .btn-pip { background: var(--surface-light); color: var(--text-main); font-size: 0.7rem; padding: 6px 12px; border: 1px solid var(--border); }

        #debug-log { background: #000; color: #4CAF50; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; padding: 12px; height: 120px; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; opacity: 0.7; }

        #pip-canvas { display: none; }
        #pip-video { display: none; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>V-Live Caption <span style="color:var(--primary); font-weight:400;">PRO</span></h1>
            <div class="status-badge"><div id="status-dot" class="status-dot"></div><span id="status-text">시스템 준비됨</span></div>
        </div>
        <div class="volume-meter">
            <span id="v-title" style="font-size: 0.65rem; font-weight:700; color:var(--text-muted);">마이크 감도</span>
            <div class="v-bar"><div id="v-fill" class="v-fill"></div></div>
            <span id="v-label" style="font-size: 0.65rem; font-weight:800; min-width:25px;">0%</span>
        </div>
    </header>

    <nav>
        <div class="nav-item active" onclick="switchMode('youtube')">실시간 세션 (Live)</div>
        <div class="nav-item" onclick="switchMode('mic')">기록 아카이브 (History)</div>
    </nav>

    <div id="youtube-container" class="container active">
        <div class="selector-box">
            <div class="selector-item">
                <label>입력 장치 선택 (Input)</label>
                <select id="device-select" onchange="initAudio()"><option value="">장치 감지 중...</option></select>
                <span id="device-hint" class="device-hint">시스템 기본 마이크 사용 중</span>
            </div>
            <div class="selector-item">
                <label>자막 모드 선택 (Mode)</label>
                <select id="engine-select" onchange="updateEngineUI()">
                    <option value="web-speech" selected>일반 자막 모드 (Standard)</option>
                    <option value="groq">고정밀 AI 모드 (Premium)</option>
                </select>
            </div>
            <div class="selector-item">
                <label>인식 언어 설정 (Lang)</label>
                <select id="lang-select">
                    <option value="ko-KR">한국어 (Korean)</option>
                    <option value="en-US">영어 (English)</option>
                    <option value="auto">언어 자동 감지</option>
                </select>
            </div>
            <div class="selector-item"><label>글자 크기</label><input type="range" id="font-size-slider" min="1" max="4" step="0.1" value="1.4" oninput="updateStyle()"></div>
            <div class="selector-item"><label>글자 색상</label><input type="color" id="text-color-picker" value="#FFEB3B" oninput="updateStyle()"></div>
        </div>

        <div class="content-grid">
            <div class="card">
                <div class="card-header">
                    <h3><span>📺</span> 실시간 자막</h3>
                    <div style="display:flex; gap:8px;"><button onclick="clearTranscript()" class="btn btn-pip">초기화</button><button onclick="togglePIP()" class="btn btn-pip">PIP 모드</button></div>
                </div>
                <div id="youtube-scroll" class="scroll-area"><div id="youtube-text"></div><div id="interim-text" class="interim" style="display:inline; opacity:0.6;"></div></div>
            </div>
            <div class="card" style="border-color: rgba(124, 77, 255, 0.3);">
                <div class="card-header"><h3><span>🧠</span> AI 스마트 어시스턴트</h3></div>
                <div class="chat-container">
                    <div id="youtube-ai" class="scroll-area">자막이 생성되면 AI에게 질문하거나 요약을 요청해보세요!</div>
                    <div class="chat-input-box">
                        <input type="text" id="chat-input" placeholder="질문을 입력하세요..." onkeypress="if(event.keyCode==13) callAI(this.value)">
                        <button onclick="callAI(document.getElementById('chat-input').value)" class="btn-send">전송</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button onclick="startProRec()" id="pro-start" class="btn btn-start">🚀 자막 생성 시작</button>
            <button onclick="stopProRec()" id="pro-stop" class="btn btn-stop" disabled>■ 세션 종료</button>
            <button onclick="callAI()" class="btn btn-download" style="background:var(--ai-glow); color:white; border:none;">✨ 자동 요약하기</button>
            <button onclick="downloadTranscript()" class="btn btn-download">📥 TXT 다운로드</button>
        </div>

        <div id="debug-log">시스템 준비 완료. Chrome 환경 권장.</div>
    </div>

    <canvas id="pip-canvas" width="800" height="200"></canvas>
    <video id="pip-video" autoplay playsinline muted></video>

    <script>
        let proInterval = null;
        let isProRunning = false;
        let audioContext = null;
        let stream = null;
        let recognition = null;
        let lastLoggedText = ""; 
        let restartTimer = null;
        
        const pipCanvas = document.getElementById('pip-canvas');
        const pipVideo = document.getElementById('pip-video');
        const pipCtx = pipCanvas.getContext('2d');

        function updateEngineUI() {
            const engine = document.getElementById('engine-select').value;
            const deviceSelect = document.getElementById('device-select');
            const deviceHint = document.getElementById('device-hint');
            if (engine === 'web-speech') {
                deviceSelect.disabled = true;
                deviceHint.style.display = 'block';
            } else {
                deviceSelect.disabled = false;
                deviceHint.style.display = 'none';
                initAudio();
            }
        }

        window.onload = () => {
            const saved = localStorage.getItem('vlive_transcript');
            if(saved) document.getElementById('youtube-text').innerText = saved;
            updateStyle();
            updateEngineUI(); 
        };

        function updateStyle() {
            const size = (localStorage.getItem('vlive_font_size') || document.getElementById('font-size-slider').value) + "rem";
            const color = localStorage.getItem('vlive_text_color') || document.getElementById('text-color-picker').value;
            document.documentElement.style.setProperty('--caption-size', size);
            document.documentElement.style.setProperty('--caption-color', color);
        }

        function clearTranscript() {
            if(confirm("기록을 삭제할까요?")) {
                document.getElementById('youtube-text').innerText = "";
                document.getElementById('interim-text').innerText = "";
                localStorage.removeItem('vlive_transcript');
                log("기록 초기화 완료.");
            }
        }

        function downloadTranscript() {
            const text = document.getElementById('youtube-text').innerText;
            if(!text) return alert("다운로드할 자막이 없습니다.");
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `V-Live_자막_${new Date().getHours()}${new Date().getMinutes()}.txt`;
            a.click();
        }

        const log = (msg, isError = false) => {
            const box = document.getElementById('debug-log');
            const color = isError ? '#FF5252' : '#00E676';
            box.innerHTML += `<span style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</span><br>`;
            box.scrollTop = box.scrollHeight;
        };

        const setStatus = (status, active = false) => {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            text.innerText = status.toUpperCase();
            if(active) dot.classList.add('active'); else dot.classList.remove('active');
        };

        function cleanText(text) {
            const noise = ["감사합니다", "thank you", "어..", "음..", "어...", "감사합니다.", "Thank you."];
            let cleaned = text.trim();
            if(!cleaned) return "";
            if(noise.some(n => cleaned.toLowerCase() === n)) return "";
            if(cleaned === lastLoggedText) return ""; 
            lastLoggedText = cleaned;
            return cleaned;
        }

        async function initAudio() {
            try {
                if (audioContext && audioContext.state !== 'closed') await audioContext.close();
                const deviceId = document.getElementById('device-select').value;
                const constraints = { audio: { deviceId: deviceId ? { exact: deviceId } : undefined, autoGainControl: false, echoCancellation: false, noiseSuppression: false } };
                if(stream) stream.getTracks().forEach(track => track.stop());
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                const devices = await navigator.mediaDevices.enumerateDevices();
                const mics = devices.filter(d => d.kind === 'audioinput');
                const select = document.getElementById('device-select');
                const currentVal = select.value;
                select.innerHTML = mics.map(m => `<option value="${m.deviceId}" ${m.deviceId === currentVal ? 'selected' : ''}>${m.label || '마이크'}</option>`).join('');
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                source.connect(analyser);
                const data = new Uint8Array(analyser.frequencyBinCount);
                function draw() {
                    if(!audioContext || audioContext.state === 'closed') return;
                    analyser.getByteFrequencyData(data);
                    let sum = 0; for(let i=0; i<data.length; i++) sum += data[i];
                    let avg = Math.round((sum / data.length) * 4.8); 
                    document.getElementById('v-fill').style.width = Math.min(100, avg) + "%";
                    document.getElementById('v-label').innerText = Math.min(100, avg) + "%";
                    updatePipCanvas();
                    requestAnimationFrame(draw);
                }
                draw();
                setStatus("준비 완료", false);
            } catch(e) { log("마이크 연결 실패", true); }
        }

        function updatePipCanvas() {
            pipCtx.fillStyle = "black"; pipCtx.fillRect(0, 0, pipCanvas.width, pipCanvas.height);
            pipCtx.fillStyle = document.getElementById('text-color-picker').value;
            const fontSize = parseFloat(document.getElementById('font-size-slider').value) * 32;
            pipCtx.font = `bold ${fontSize}px Pretendard, sans-serif`; pipCtx.textAlign = "center";
            const fullText = (document.getElementById('youtube-text').innerText + " " + document.getElementById('interim-text').innerText).trim();
            const lastWords = fullText.split(' ').slice(-8).join(' ');
            pipCtx.fillText(lastWords, pipCanvas.width/2, pipCanvas.height/2 + 15);
        }

        async function togglePIP() {
            try {
                if (document.pictureInPictureElement) await document.exitPictureInPicture();
                else { if (!pipVideo.srcObject) pipVideo.srcObject = pipCanvas.captureStream(); await pipVideo.play(); await pipVideo.requestPictureInPicture(); }
            } catch (e) { log("PIP 에러", true); }
        }

        function switchMode(mode) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(mode + '-container').classList.add('active');
            stopProRec();
        }

        async function startProRec() {
            isProRunning = true;
            document.getElementById('pro-start').disabled = true;
            document.getElementById('pro-stop').disabled = false;
            setStatus("캡처 중", true);
            if (document.getElementById('engine-select').value === 'web-speech') {
                if(stream) stream.getTracks().forEach(track => track.stop());
                if(audioContext) await audioContext.close();
                document.getElementById('v-title').innerText = "엔진 점유 중";
                startWebSpeech(document.getElementById('lang-select').value);
            } else {
                document.getElementById('v-title').innerText = "마이크 감도";
                await initAudio();
                startGroqWhisper(document.getElementById('lang-select').value);
            }
        }

        function startWebSpeech(lang) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return log("지원 안 함", true);
            recognition = new SpeechRecognition();
            recognition.continuous = true; recognition.interimResults = true;
            recognition.lang = lang === 'auto' ? (navigator.language || 'ko-KR') : lang;
            recognition.onresult = (event) => {
                let interim = ''; let final = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) final += event.results[i][0].transcript;
                    else interim += event.results[i][0].transcript;
                }
                document.getElementById('interim-text').innerText = interim;
                if (final) {
                    const cleaned = cleanText(final);
                    if(cleaned) {
                        const el = document.getElementById('youtube-text');
                        el.innerText += cleaned + " ";
                        localStorage.setItem('vlive_transcript', el.innerText);
                    }
                }
            };
            recognition.onend = () => { if (isProRunning) { setTimeout(() => { try { recognition.start(); } catch(e){} }, 500); } };
            try { recognition.start(); } catch(e) {}
        }

        function startGroqWhisper(lang) {
            proInterval = setInterval(async () => {
                if (!isProRunning) return;
                const recorder = new MediaRecorder(stream);
                const chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    if (blob.size < 2500) return;
                    const formData = new FormData();
                    formData.append('file', blob, 'audio.webm');
                    formData.append('model', 'whisper-large-v3');
                    if (lang !== 'auto') formData.append('language', lang.split('-')[0]);
                    try {
                        const res = await fetch('/api/stt', { method: 'POST', body: formData });
                        const data = await res.json();
                        if (res.ok && data.text) {
                            const cleaned = cleanText(data.text);
                            if (cleaned) {
                                const el = document.getElementById('youtube-text');
                                el.innerText += cleaned + " ";
                                localStorage.setItem('vlive_transcript', el.innerText);
                            }
                        }
                    } catch (e) {}
                };
                recorder.start();
                setTimeout(() => { if(recorder.state === 'recording') recorder.stop(); }, 3000);
            }, 3500);
        }

        function stopProRec() { 
            isProRunning = false; clearInterval(proInterval);
            if (recognition) { recognition.onend = null; try { recognition.stop(); } catch(e) {} }
            document.getElementById('pro-start').disabled = false; document.getElementById('pro-stop').disabled = true;
            document.getElementById('interim-text').innerText = ""; setStatus("IDLE", false);
            document.getElementById('v-title').innerText = "마이크 감도";
            initAudio();
        }

        async function callAI(question = null) {
            const text = document.getElementById('youtube-text').innerText;
            if (text.length < 10) return log("데이터 부족", true);
            const aiArea = document.getElementById('youtube-ai');
            if (question) {
                aiArea.innerHTML += `<div style="margin-top:10px; color:var(--primary); font-weight:bold;">Q: ${question}</div>`;
                document.getElementById('chat-input').value = "";
            } else {
                aiArea.innerHTML = "분석 중...";
            }
            try {
                const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, question }) });
                const data = await res.json();
                const result = data.result || "응답 데이터를 가져오지 못했습니다.";
                if (question) aiArea.innerHTML += `<div style="margin-bottom:10px; color:#fff;">A: ${result}</div>`;
                else aiArea.innerHTML = result;
                aiArea.scrollTop = aiArea.scrollHeight;
            } catch (e) { log("AI 오류", true); }
        }
    </script>
</body>
</html>

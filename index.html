<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V-Live Caption | AI 실시간 자막</title>
    <style>
        :root {
            --primary: #4CAF50;
            --ai-accent: #8E44AD;
            --danger: #f44336;
            --bg-color: #121212;
            --surface: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --nav-bg: #252525;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background-color: var(--surface);
            border-bottom: 1px solid #333;
        }

        nav {
            display: flex;
            background-color: var(--nav-bg);
            padding: 0 5%;
            gap: 10px;
        }

        .nav-item {
            padding: 1.2rem 1rem;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-muted);
            border-bottom: 4px solid transparent;
            transition: all 0.2s;
        }

        .nav-item.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .container {
            flex: 1;
            display: none;
            flex-direction: column;
            padding: 1.5rem 1rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            gap: 1rem;
        }

        .container.active { display: flex; }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            flex: 1;
        }

        @media (max-width: 900px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-header {
            padding: 1rem 1.2rem;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid #333;
            font-weight: bold;
        }

        .scroll-area {
            flex: 1;
            padding: 1.2rem;
            overflow-y: auto;
            height: 40vh;
            line-height: 1.8;
            font-size: 1.2rem;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            padding: 1rem 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:active { transform: scale(0.95); }
        .btn-start { background: var(--primary); color: white; }
        .btn-stop { background: var(--danger); color: white; }
        .btn-ai { background: var(--ai-accent); color: white; }

        .info-banner {
            background: rgba(52, 152, 219, 0.1);
            border-left: 4px solid #3498db;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        footer { padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <h1 style="font-size: 1.4rem; margin:0;">🚀 V-Live Caption</h1>
        <button class="btn" style="background:#333; color:white; font-size:0.7rem;" onclick="location.reload()">↻ 새로고침</button>
    </header>

    <nav>
        <div class="nav-item active" onclick="switchMode('mic')">🎙️ 1. 내 목소리</div>
        <div class="nav-item" onclick="switchMode('youtube')">📺 2. 고정밀 자막(Pro)</div>
    </nav>

    <!-- 모드 2: 고정밀 자막 -->
    <div id="youtube-container" class="container">
        <div class="info-banner">
            ✨ <strong>Pro 모드:</strong> 이제 노래와 시끄러운 영상도 정확하게 잡아냅니다! (Groq AI 가동)
        </div>
        <div class="content-grid">
            <div class="card">
                <div class="card-header">📺 실시간 고정밀 자막</div>
                <div id="youtube-scroll" class="scroll-area" style="background:#000;">
                    <div id="youtube-text" style="color:#FFEB3B; font-weight:bold;"></div>
                </div>
            </div>
            <div class="card" style="border-color: var(--ai-accent);">
                <div class="card-header" style="color: #d1b3ff;">🧠 AI 요약</div>
                <div class="scroll-area" id="youtube-ai"></div>
            </div>
        </div>
        <div class="controls">
            <button onclick="startProRec()" id="pro-start" class="btn btn-start">🚀 자막 시작</button>
            <button onclick="stopProRec()" id="pro-stop" class="btn btn-stop" disabled>■ 중지</button>
            <button onclick="callAI('youtube')" class="btn btn-ai">✨ 요약하기</button>
        </div>
    </div>

    <!-- 모드 1: 내 목소리 -->
    <div id="mic-container" class="container active">
        <div class="info-banner">🎙️ 내 목소리를 AI가 기록하고 해석합니다.</div>
        <div class="content-grid">
            <div class="card">
                <div class="card-header">📝 실시간 기록</div>
                <div id="mic-scroll" class="scroll-area">
                    <span id="mic-final"></span>
                    <span id="mic-interim" style="color:gray;"></span>
                </div>
            </div>
            <div class="card"><div class="card-header">🧠 AI 해석</div><div class="scroll-area" id="mic-ai"></div></div>
        </div>
        <div class="controls">
            <button onclick="startRec('mic')" id="mic-start" class="btn btn-start">🎙️ 시작</button>
            <button onclick="stopRec()" id="mic-stop" class="btn btn-stop" disabled>■ 중지</button>
        </div>
    </div>

    <script>
        let recognition = null;
        let proInterval = null;
        let isProRunning = false;

        function switchMode(mode) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(mode + '-container').classList.add('active');
            event.currentTarget.classList.add('active');
            stopRec();
            stopProRec();
        }

        // --- 일반 인식 (모드 1) ---
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        function startRec(mode) {
            recognition = new SpeechRecognition();
            recognition.interimResults = true;
            recognition.lang = 'ko-KR';
            recognition.continuous = true;
            recognition.onstart = () => {
                document.getElementById(mode + '-start').disabled = true;
                document.getElementById(mode + '-stop').disabled = false;
            };
            recognition.onresult = (event) => {
                let interim = '';
                const finalSpan = document.getElementById(mode + '-final');
                const interimSpan = document.getElementById(mode + '-interim');
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalSpan.innerText += event.results[i][0].transcript + ' ';
                    else interim += event.results[i][0].transcript;
                }
                interimSpan.innerText = interim;
                const scroll = document.getElementById(mode + '-scroll');
                scroll.scrollTop = scroll.scrollHeight;
            };
            recognition.start();
        }
        function stopRec() { if(recognition) recognition.stop(); document.querySelectorAll('.btn-start').forEach(b => b.disabled = false); document.querySelectorAll('.btn-stop').forEach(b => b.disabled = true); }

        // --- Pro 인식 (모드 2) ---
        async function startProRec() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                isProRunning = true;
                document.getElementById('pro-start').disabled = true;
                document.getElementById('pro-stop').disabled = false;

                proInterval = setInterval(async () => {
                    if (!isProRunning) return;
                    const recorder = new MediaRecorder(stream);
                    const chunks = [];
                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = async () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const formData = new FormData();
                        formData.append('file', blob, 'audio.webm');
                        formData.append('model', 'whisper-large-v3');
                        formData.append('language', 'ko');
                        try {
                            const res = await fetch('/api/stt', { method: 'POST', body: formData });
                            const data = await res.json();
                            if (data.text) {
                                document.getElementById('youtube-text').innerHTML += data.text + " ";
                                const scroll = document.getElementById('youtube-scroll');
                                scroll.scrollTop = scroll.scrollHeight;
                            }
                        } catch (e) {}
                    };
                    recorder.start();
                    setTimeout(() => { if(recorder.state === 'recording') recorder.stop(); }, 3000);
                }, 3500);
            } catch (err) { alert("마이크 권한 필요"); }
        }
        function stopProRec() { isProRunning = false; clearInterval(proInterval); document.getElementById('pro-start').disabled = false; document.getElementById('pro-stop').disabled = true; }

        async function callAI(mode) {
            const text = mode === 'mic' ? document.getElementById('mic-final').innerText : document.getElementById('youtube-text').innerText;
            const aiBox = document.getElementById(mode + '-ai');
            aiBox.innerText = "⏳ 요약 중...";
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await res.json();
                aiBox.innerHTML = data.result || data.error;
            } catch (e) { aiBox.innerText = "실패"; }
        }
    </script>
</body>
</html>
